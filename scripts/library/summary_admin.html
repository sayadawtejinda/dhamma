<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>အနှစ်ချုပ် ထည့်ရန်</title>
<style>
:root{--bg:#fff7ea;--card:#fff;--ink:#3a1e12;--mute:#8a6a52;--line:#ecd7b4;--ac:#b4381e;--ac2:#e8a21a;--ok:#1f7a55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Myanmar","Pyidaungsu","Myanmar Text",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:8px 14px;background:linear-gradient(135deg,#7a1f1f,#b4381e);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:1.1rem}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)} button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.on{background:var(--ac2);color:#2a1a08;border-color:var(--ac2);font-weight:700}
header button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
header button.pub{background:#fff;color:#7a1f1f;font-weight:700}
#main{flex:1;display:flex;min-height:0}
#left{width:380px;max-width:42%;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
#tools{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
#kinds{display:flex;gap:5px;flex-wrap:wrap}
input[type=search]{width:100%;padding:8px 11px;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
#list{overflow-y:auto;flex:1}
.it{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:var(--bg)} .it.sel{background:#fdeccc}
.it i{flex:none;width:20px;text-align:center;font-style:normal;color:var(--ok)}
.it small{display:block;color:var(--mute);font-size:.78rem}
#right{flex:1;padding:12px 16px;overflow-y:auto;min-width:0}
#right h2{margin:0 0 2px;font-size:1.15rem;color:var(--ac)}
#sub{color:var(--mute);font-size:.88rem;margin-bottom:8px}
audio{width:100%;margin:6px 0}
textarea{width:100%;height:46vh;min-height:220px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:1rem;background:#fff;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--ac2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#msg{color:var(--ok);font-size:.9rem}
#prev{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:8px 14px;margin-top:8px}
#prev h4{margin:.6em 0 .2em;color:var(--ac)} #prev p{margin:.4em 0} #prev ul{margin:.3em 0;padding-left:1.3em}
pre#log{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap;font-size:.8rem;display:none}
.hint{color:var(--mute);font-size:.85rem}
@media(max-width:800px){#main{flex-direction:column}#left{width:100%;max-width:none;height:40%}}
</style>
</head>
<body>
<header><b>📝 အနှစ်ချုပ် ထည့်ရန်</b><span id="counts" style="opacity:.9;font-size:.9rem"></span><span style="flex:1"></span><button class="pub" id="pub">🚀 website ပေါ်သို့ တင်မည်</button></header>
<div id="main">
 <div id="left"><div id="tools"><div id="kinds"></div><input type="search" id="q" placeholder="ရှာရန် … (အမည်၊ နံပါတ်)"><label class="hint"><input type="checkbox" id="onlyNo"> အနှစ်ချုပ် မရှိသေးတာကိုသာ ပြ</label></div><div id="list"></div></div>
 <div id="right"><div id="empty" class="hint">ဘယ်ဘက်က တစ်ခုကို ရွေးပါ။</div>
  <div id="ed" style="display:none">
   <h2 id="t"></h2><div id="sub"></div>
   <audio id="au" controls preload="none"></audio>
   <textarea id="ta" placeholder="အနှစ်ချုပ်ကို ဒီမှာ ရေး (သို့) paste လုပ်ပါ။&#10;&#10;# ခေါင်းစဉ်ငယ်&#10;- အချက်တစ်ခု&#10;- အချက်နှစ်ခု&#10;&#10;**စာလုံးမည်း** လည်း သုံးနိုင်သည်။"></textarea>
   <div class="bar"><button class="pri" id="save">💾 သိမ်းမည် (Ctrl+S)</button><button id="saveNext">သိမ်းပြီး နောက်တစ်ခု ▶</button><button id="del">🗑 ဖျက်မည်</button><span id="msg"></span></div>
   <div class="hint">သိမ်းပြီးရင် ဘယ်ဘက်မှာ ✓ ပေါ်မည်။ အားလုံး ပြီးမှ (သို့) တစ်ခါတစ်ခါ အပေါ်ညာက <b>🚀 website ပေါ်သို့ တင်မည်</b> ကိုနှိပ်ပါ။</div>
   <div id="prev"></div>
  </div>
  <pre id="log"></pre>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KN={sermon:'တရားတော်',tape:'တရားခွေ (တစ်ခွေချင်း)',book:'စာအုပ် (PDF)',text:'ဖတ်စာ'};
let CAT=null,kind='sermon',cur=null,dirty=false;
function md(t){const L=t.split('\n');let h='',ul=false;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 for(const l of L){const m=/^\s*[-*•]\s+(.*)/.exec(l);if(m){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(m[1])+'</li>';continue}if(ul){h+='</ul>';ul=false}
  if(/^#{1,4}\s/.test(l))h+='<h4>'+inl(l.replace(/^#+\s*/,''))+'</h4>';else if(l.trim())h+='<p>'+inl(l)+'</p>'}
 return h+(ul?'</ul>':'')}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});return r.json()}
async function init(){CAT=await api('/api/catalog');$('#kinds').innerHTML=Object.entries(KN).map(([k,v])=>`<button data-k="${k}" class="${k===kind?'on':''}">${v}</button>`).join('');
 $('#kinds').onclick=e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;[...$('#kinds').children].forEach(x=>x.classList.toggle('on',x===b));render()};render();counts()}
function counts(){const c=CAT.counts;$('#counts').textContent=`ရေးပြီး — တရား ${c.sermon} · ခွေ ${c.tape} · စာအုပ် ${c.book} · ဖတ်စာ ${c.text}`}
function render(){const q=$('#q').value.trim().toLowerCase(),no=$('#onlyNo').checked;
 const items=CAT.items.filter(i=>i.kind===kind&&(!q||(i.title+' '+i.sub+' '+i.key).toLowerCase().includes(q))&&(!no||!i.has));
 $('#list').innerHTML=items.slice(0,600).map(i=>`<div class="it ${cur&&cur.kind===i.kind&&cur.key===i.key?'sel':''}" data-k="${esc(i.key)}"><i>${i.has?'✓':''}</i><div>${esc(i.title)}<small>${esc(i.sub||'')}</small></div></div>`).join('')+(items.length>600?`<div class="hint" style="padding:8px">… နောက်ထပ် ${items.length-600} ခု — ရှာပါ</div>`:'');
 $('#list').onclick=e=>{const d=e.target.closest('.it');if(!d)return;open(CAT.items.find(i=>i.kind===kind&&i.key===d.dataset.k))}}
async function open(it){if(!it)return;if(dirty&&!confirm('သိမ်းမထားသေးပါ။ ဆက်သွားမလား?'))return;cur=it;dirty=false;
 $('#empty').style.display='none';$('#ed').style.display='block';$('#t').textContent=it.title;$('#sub').textContent=KN[it.kind]+' · '+it.key;
 const r=await api('/api/get?kind='+it.kind+'&key='+encodeURIComponent(it.key));$('#ta').value=r.text||'';preview();$('#msg').textContent='';
 const au=$('#au');if(it.kind==='tape'){const n=+it.key,b=CAT.audio;au.style.display='block';au.src=(n>1303?b[1]:b[0])+encodeURIComponent(it.file)}else{au.pause();au.removeAttribute('src');au.style.display='none'}
 render()}
function preview(){$('#prev').innerHTML=$('#ta').value.trim()?md($('#ta').value):'<span class="hint">(ကြိုကြည့်ချက်)</span>'}
$('#ta').oninput=()=>{dirty=true;preview();$('#msg').textContent=''};
async function save(){if(!cur)return false;const r=await api('/api/save',{kind:cur.kind,key:cur.key,text:$('#ta').value});if(r.error){$('#msg').style.color='#b3261e';$('#msg').textContent=r.error;return false}
 cur.has=!!$('#ta').value.trim();CAT.counts=Object.assign({},r.counts);dirty=false;$('#msg').style.color='';$('#msg').textContent='✅ သိမ်းပြီး';counts();render();return true}
$('#save').onclick=save;
$('#saveNext').onclick=async()=>{if(await save()){const list=CAT.items.filter(i=>i.kind===kind);const i=list.indexOf(cur);const nx=list.slice(i+1).find(x=>!x.has)||list[i+1];if(nx)open(nx)}};
$('#del').onclick=async()=>{if(!cur||!confirm('ဒီအနှစ်ချုပ်ကို ဖျက်မလား?'))return;$('#ta').value='';await save()};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});
$('#q').oninput=render;$('#onlyNo').onchange=render;
$('#pub').onclick=async()=>{if(dirty&&!(await save()))return;const lg=$('#log');lg.style.display='block';lg.textContent='⏳ တင်နေသည်… (ခဏစောင့်ပါ)';$('#empty').style.display='none';const r=await api('/api/publish',{});lg.textContent=r.log||r.error};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
init();
</script>
</body>
</html>
