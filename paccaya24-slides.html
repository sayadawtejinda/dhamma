<style>
:root{--bg:#1b1410;--card:#2a2019;--ink:#f5ead8;--mute:#bfae94;--gold:#e8b04a;--teal:#6cc5b8;--rose:#e58a8a;--line:#4a3a2c}
@media (prefers-color-scheme:light){:root{--bg:#faf3e6;--card:#fff;--ink:#2b1f14;--mute:#6f5d49;--gold:#a8650a;--teal:#0f7c70;--rose:#b23b3b;--line:#e2d3b9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
#top b{color:var(--gold)}
#top .sp{flex:1}
button,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.on{background:var(--gold);color:#1b1410;border-color:var(--gold)}
#stage{position:fixed;top:52px;bottom:52px;left:0;right:0;overflow-y:auto;padding:20px 16px}
.slide{max-width:1100px;margin:0 auto}
h1{font-size:2.2rem;margin:.2em 0;color:var(--gold)}
h2{font-size:1.9rem;margin:0;color:var(--gold)}
.num{display:inline-block;background:var(--gold);color:#1b1410;border-radius:50%;width:2.2em;height:2.2em;line-height:2.2em;text-align:center;font-weight:700;margin-right:10px;font-size:.8em}
.sub{color:var(--mute);margin:.3em 0 1em}
.part{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.part h3{margin:0 0 4px;font-size:1.05rem;color:var(--teal)}
.rel{color:var(--mute);font-size:.92rem;margin-bottom:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.col h4{margin:0 0 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.col.g h4{color:var(--gold)}.col.r h4{color:var(--rose)}
.col p{margin:0 0 6px}
.vi{color:var(--teal)}
body[data-lang=en] .vi,body[data-lang=vi] .en{display:none}
.xref{color:var(--gold);font-weight:600;text-decoration:underline}
.links{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.links a{color:var(--ink);border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:20px;text-decoration:none;font-size:.9rem}
.links a:hover{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.grid button{text-align:left;padding:10px 12px}
.grid small{display:block;color:var(--mute)}
#bot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:8px;background:var(--bg);border-top:1px solid var(--line)}
</style>
</head>

{n:22,pali:"Natthi paccayo",en:"Absence condition",vi:"Vô Hữu Duyên",parts:[

];

const q=s=>encodeURIComponent(s);
const bi=o=>`<span class="en">${o.en}</span><span class="vi">${o.vi}</span>`;
const REF={"ārammaṇa-adhipati":3,"vatthu-purejāta":10,"sahajāta":6,"purejāta":10,"pacchājāta":11,"āhāra":15,"indriya":16,"anantara":4,
"vật tiền sanh":10,"cảnh trưởng":3,"câu sanh":6,"tiền sanh":10,"hậu sanh":11,"vật thực":15,"quyền":16,"vô gián":4};
const RX=new RegExp(Object.keys(REF).sort((a,b)=>b.length-a.length).join('|'),'gi');
const link=s=>/^(Similar to|Tương tự|Tương tợ)/.test(s)?s.replace(RX,m=>`<a class="xref" href="#" onclick="go(${REF[m.toLowerCase()]+1});return false">${m} →</a>`):s;
const bip=o=>`<p><span class="en">${link(o.en)}</span><span class="vi">${link(o.vi)}</span></p>`;
const slides=[];
slides.push(()=>`<div class="slide"><h1>24 Paccayas</h1>
<p class="sub"><span class="en">The 24 conditional relations of the Paṭṭhāna — Paccaya (condition) → Paccayuppanna (conditioned)</span><span class="vi">24 Duyên trong bộ Paṭṭhāna — Paccaya (năng duyên) → Paccayuppanna (sở duyên)</span></p>
<div class="links">
<a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/Patthana">Wikipedia: Paṭṭhāna</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q('24 paccaya patthana conditional relations')}">Google (EN)</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q('24 duyên Paṭṭhāna Vô Tỷ Pháp')}">Google (VI)</a>
<a target="_blank" rel="noopener" href="https://suttacentral.net/search?query=${q('paccaya')}">SuttaCentral</a>
</div><p class="sub">Use ◀ ▶ keys or the buttons. Switch language at the top.</p></div>`);
slides.push(()=>`<div class="slide"><h2>Index · Mục lục</h2><div class="grid" style="margin-top:14px">${P.map((p,i)=>`<button onclick="go(${i+2})"><b>${p.n}. ${p.pali}</b><small>${p.en} · ${p.vi}</small></button>`).join('')}</div></div>`);
P.forEach(p=>slides.push(()=>{
 const e=p.pali.replace(/ paccayo/,'');
 return `<div class="slide"><h2><span class="num">${p.n}</span>${p.pali}</h2>
 <p class="sub"><span class="en">${p.en}</span><span class="vi">${p.vi}</span> &nbsp;|&nbsp; <span class="en">${p.vi}</span><span class="vi">${p.en}</span></p>
 ${p.parts.map(x=>`<div class="part">${x.title?`<h3>${bi(x.title)}</h3>`:''}${x.rel&&x.rel.en?`<div class="rel">${bi(x.rel)}</div>`:''}
 <div class="cols"><div class="col g"><h4>Paccaya · ${'<span class="en">condition</span><span class="vi">năng duyên</span>'}</h4>${x.g.map(bip).join('')}</div>
 <div class="col r"><h4>Paccayuppanna · ${'<span class="en">conditioned</span><span class="vi">sở duyên</span>'}</h4>${x.r.length?x.r.map(bip).join(''):'<p class="rel">—</p>'}</div></div></div>`).join('')}
 <div class="links">
 <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q(e+' paccaya patthana')}">Search EN</a>
 <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q(p.vi+' Paṭṭhāna 24 duyên')}">Tìm tiếng Việt</a>
 <a target="_blank" rel="noopener" href="https://suttacentral.net/search?query=${q(e)}">SuttaCentral</a>
 <a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/Patthana">Wikipedia</a>
 <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q(p.pali+' '+p.vi)}">YouTube</a>
 </div></div>`}));

let cur=0;const st=document.getElementById('stage');
function go(i){cur=Math.max(0,Math.min(slides.length-1,i));st.innerHTML=slides[cur]();st.scrollTop=0;
 document.getElementById('pos').textContent=(cur+1)+' / '+slides.length;location.hash=cur+1;}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('idx').onclick=()=>go(1);
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{document.body.dataset.lang=b.dataset.l;
 document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b));});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
