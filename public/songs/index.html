<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ဓမ္မစကူးလ် သီချင်း ကဗျာများ</title>
<meta name="theme-color" content="#5b2a86">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ff;--card:#fff;--ink:#2b1745;--mute:#7b6896;--line:#e6d9f5;--accent:#7b3fb8;--accent2:#f0a63a;--accent-ink:#fff;--shadow:0 6px 22px rgba(80,30,130,.15)}
@media (prefers-color-scheme:dark){:root{--bg:#150d20;--card:#221533;--ink:#f3e9ff;--mute:#b9a5d6;--line:#3b2a55;--accent:#b583ee;--accent2:#f5bb5c;--accent-ink:#150d20;--shadow:0 6px 22px rgba(0,0,0,.5)}}
:root[data-theme=light]{--bg:#fbf6ff;--card:#fff;--ink:#2b1745;--mute:#7b6896;--line:#e6d9f5;--accent:#7b3fb8;--accent2:#f0a63a;--accent-ink:#fff;--shadow:0 6px 22px rgba(80,30,130,.15)}
:root[data-theme=dark]{--bg:#150d20;--card:#221533;--ink:#f3e9ff;--mute:#b9a5d6;--line:#3b2a55;--accent:#b583ee;--accent2:#f5bb5c;--accent-ink:#150d20;--shadow:0 6px 22px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Pyidaungsu","Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;padding-bottom:92px}
button{font:inherit;color:inherit;cursor:pointer}
header.hero{background:radial-gradient(circle at 15% 20%,#f0a63a55 0,transparent 40%),radial-gradient(circle at 85% 10%,#ff6fb155 0,transparent 45%),linear-gradient(135deg,#3b1a66 0%,#6a2fa8 55%,#c0489a 120%);color:#fff;padding:24px 16px 20px;position:relative;overflow:hidden}
header.hero::after{content:"❀";position:absolute;right:-24px;top:-40px;font-size:190px;opacity:.13}
header.hero::before{content:"♪ ♫ ♪";position:absolute;left:12px;bottom:-4px;font-size:44px;opacity:.12;letter-spacing:10px}
.wrap{max-width:1000px;margin:0 auto}
header.hero h1{margin:0;font-size:1.55rem;line-height:1.4}
header.hero p{margin:4px 0 0;opacity:.92;font-size:.95rem}
#theme{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.2);border:0;border-radius:20px;padding:4px 10px;color:#fff;z-index:2}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px}
nav.tabs button{background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--mute)}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent2)}
.search::before{content:"🔍";position:absolute;left:14px;top:11px}
select{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;max-width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 13px;font-size:.9rem}
.chip.on{background:var(--accent2);color:#2a1a08;border-color:var(--accent2);font-weight:600}
.count{color:var(--mute);font-size:.9rem;margin:2px 2px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.song{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:box-shadow .12s}
.song:hover{box-shadow:var(--shadow)}
.song.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pl{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:1rem}
.song .mid{flex:1;min-width:0}
.song h3{margin:0;font-size:1rem;line-height:1.45;font-weight:600}
.song small{color:var(--mute);display:block;line-height:1.4}
.song .rt{flex:none;text-align:right;color:var(--mute);font-size:.8rem;line-height:1.4}
.more{display:block;margin:14px auto;padding:10px 22px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cc{border:0;border-radius:18px;padding:16px 14px;text-align:left;color:#fff;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}
.cc b{font-size:1.02rem;line-height:1.4}.cc small{opacity:.9}
.arts{display:flex;flex-wrap:wrap;gap:8px}
.arts button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px}
.arts button small{color:var(--mute)}
/* now-playing */
dialog{border:0;border-radius:22px;padding:0;color:#fff;width:min(560px,96vw);max-height:94vh;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(20,6,40,.65);backdrop-filter:blur(3px)}
.np{display:flex;flex-direction:column;max-height:94vh;background:var(--g);background-size:300% 300%;animation:flow 18s ease infinite;position:relative}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.np::before{content:"❀";position:absolute;right:-30px;top:-34px;font-size:220px;opacity:.1;pointer-events:none}
.np .top{display:flex;gap:6px;padding:12px 14px 0;align-items:center}
.np .top .sp{flex:1}
.ib{background:rgba(255,255,255,.2);border:0;border-radius:50%;width:36px;height:36px;color:#fff;font-size:1rem;display:grid;place-items:center}
.ib.on{background:#fff;color:#333}
.np .body{overflow:auto;padding:6px 20px 18px}
.np h2{margin:10px 0 0;font-size:1.35rem;line-height:1.5;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.np .art{opacity:.92;margin:0 0 8px}
.np .ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0 4px}
.np .ctl .ib{width:44px;height:44px;font-size:1.15rem}
.np .ctl .big{width:62px;height:62px;font-size:1.6rem;background:#fff;color:#4a1d7a}
.seek{display:flex;gap:8px;align-items:center;font-size:.82rem}
.seek input{flex:1;accent-color:#fff}
.lyr{margin:12px 0 0;background:rgba(0,0,0,.22);border-radius:16px;padding:12px 16px;font-size:1.06rem;line-height:2;white-space:pre-wrap;backdrop-filter:blur(2px)}
.lyr.empty{white-space:normal;opacity:.85;text-align:center;font-size:.95rem}
.fs{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.cm{margin-top:14px;background:rgba(0,0,0,.2);border-radius:16px;padding:10px 14px}
.cm summary{cursor:pointer;font-weight:600}
.cm input,.cm textarea{width:100%;border-radius:10px;border:0;padding:8px 10px;font:inherit;color:#222;margin:6px 0}
.cm .item{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;margin:8px 0}
.cm .item small{opacity:.8}
.cm .item p{margin:2px 0;white-space:pre-wrap}
.cm button.send,.btn{border:0;border-radius:10px;padding:7px 16px;background:#fff;color:#4a1d7a;font-weight:700}
.cm .del{float:right;background:none;border:0;color:#fff;opacity:.8}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row2 .btn{background:rgba(255,255,255,.22);color:#fff}
.pr{height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:6px}.pr i{display:block;height:100%;background:#fff;width:0}
/* mini bar */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;gap:10px;padding:8px 12px;color:#fff;background:var(--g);cursor:pointer;box-shadow:0 -6px 22px rgba(0,0,0,.3)}
#mini.on{display:flex}
#mini .t{flex:1;min-width:0;line-height:1.35}#mini .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini .t small{opacity:.85}
#mini .ib{width:40px;height:40px}
#mini .bar2{position:absolute;left:0;top:0;height:3px;background:#fff;width:0}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.ctrl{display:flex;gap:4px;margin-left:4px}.ctrl button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;padding:0}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}.hd h2{margin:0;font-size:1.15rem;flex:1}
.b2{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px}.b2.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#dpl{color:var(--ink);background:var(--bg);padding:16px}#dpl label{display:block;margin:6px 0}#dpl input[type=text]{width:100%;padding:8px;border-radius:9px;border:1px solid var(--line);font:inherit}
.th{flex:none;width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--line)}
.cover{display:block;margin:10px auto 0;max-width:100%;max-height:260px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:zoom-in;background:rgba(255,255,255,.15)}
.cover.big{max-height:none;width:100%;cursor:zoom-out}
.vers{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.vers button{border:0;border-radius:999px;padding:4px 14px;background:rgba(255,255,255,.22);color:#fff;font-weight:600}.vers button.on{background:#fff;color:#4a1d7a}
.vsm{color:var(--accent)!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2b1745;color:#fff;padding:8px 16px;border-radius:12px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="hero"><button id="theme" title="အလင်း/အမှောင်">🌓</button><button id="imgm" style="position:absolute;right:62px;top:12px;background:rgba(255,255,255,.2);border:0;border-radius:20px;padding:4px 10px;color:#fff;z-index:2" title="ပုံပြ/မပြ (ဒေတာချွေတာရန်)">🖼</button><div class="wrap"><h1>🎶 ဓမ္မစကူးလ် သီချင်း ကဗျာများ</h1><p id="sub">ဖွင့်ကြည့် · ရှာကြည့် · offline သိမ်းနားထောင်</p></div></header>
<nav class="tabs" id="tabs"><button data-t="songs" class="on">သီချင်းများ</button><button data-t="cols">စုစည်းမှုများ</button><button data-t="arts">အဆိုတော်များ</button><button data-t="lists">♥ စာရင်းများ</button><button data-t="off">⬇ Offline</button></nav>
<div class="wrap" style="padding:0 14px">
 <div class="bar"><div class="search"><input id="q" type="search" placeholder="သီချင်းအမည်၊ အဆိုတော်၊ စုစည်းမှု ရှာရန်…" autocomplete="off"></div>
  <select id="sort"><option value="title">အမည် က–အ</option><option value="artist">အဆိုတော် က–အ</option><option value="orig">မူလအစဉ်</option><option value="long">အရှည်ဆုံး</option></select>
  <select id="col"><option value="">စုစည်းမှုအားလုံး</option></select></div>
 <div class="chips" id="chips"><button class="chip" data-f="lyr">📝 စာသားပါသည်</button><button class="chip" data-f="off">⬇ offline သိမ်းထားသည်</button><button class="chip" data-f="na">⚠ အမည်မရှိသေး</button></div>
 <div class="count" id="count"></div><div id="batch"></div>
 <div id="view"></div>
</div>
<div id="mini"><div class="bar2" id="mbar"></div><button class="ib" id="mprev">⏮</button><button class="ib" id="mpp">▶</button><button class="ib" id="mnext">⏭</button><div class="t"><b id="mt"></b><small id="ma"></small></div></div>
<dialog id="np"><div class="np" id="npb">
 <div class="top"><button class="ib" id="nclose" title="ပိတ်">✕</button><span class="sp"></span><button class="ib" id="nbg" title="နောက်ခံပြောင်း">🎨</button><button class="ib" id="nshuf" title="ကြုံရာ">🔀</button><button class="ib" id="nrep" title="ပြန်ဆိုမည်">🔁</button></div>
 <div class="body"><h2 id="nt"></h2><p class="art" id="na"></p><div class="vers" id="nver"></div><div id="nimg"></div>
  <div class="seek"><span id="ncur">0:00</span><input type="range" id="nseek" min="0" max="1000" value="0"><span id="ndur">0:00</span></div>
  <div class="ctl"><button class="ib" id="nprev">⏮</button><button class="ib big" id="npp">▶</button><button class="ib" id="nnext">⏭</button></div>
  <div class="row2"><button class="btn" id="noff">⬇ offline သိမ်းမည်</button><button class="btn" id="nshare">🔗 လင့်ခ်</button><button class="btn" id="nlist">➕ စာရင်းထဲထည့်</button></div><div class="pr" id="npr" hidden><i></i></div>
  <div id="nlyr" class="lyr empty">စာသား မရှိသေးပါ</div>
  <div class="fs"><button class="ib" id="fsm">A−</button><button class="ib" id="fsp">A+</button></div>
  <details class="cm" id="cm"><summary>💬 မှတ်ချက်များ <span id="cmn"></span></summary><div id="cmbody"></div></details>
 </div></div></dialog>
<dialog id="dpl"><h3 style="margin:0 0 6px">➕ စာရင်းထဲ ထည့်ရန်</h3><div id="dplb"></div><input type="text" id="dpln" placeholder="စာရင်းအသစ်အမည်…" maxlength="40"><div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="b2" onclick="dpl.close()">ပိတ်မည်</button><button class="b2 pri" id="dplok">ပြီးပြီ</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DV=String(Math.floor(Date.now()/300000));
const MMN='၀၁၂၃၄၅၆၇၈၉';const mn=n=>String(n).replace(/\d/g,d=>MMN[d]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const norm=s=>String(s||'').toLowerCase().replace(/[​-‍﻿\s\-_.,။၊()]+/g,'');
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}
// theme
(function(){const t=lsGet('songsTheme','');if(t)document.documentElement.dataset.theme=t})();
$('#theme').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';lsSet('songsTheme',d.dataset.theme)};
// pretty backgrounds
const BG=['linear-gradient(135deg,#3b1a66,#6a2fa8,#c0489a,#f0a63a)','linear-gradient(135deg,#0f4c5c,#1b7f8c,#4fb99f,#f2d492)','linear-gradient(135deg,#7a1f1f,#b4381e,#e8a21a,#fff0b3)','linear-gradient(135deg,#102a5c,#2c5db8,#6aa7ff,#c6e0ff)','linear-gradient(135deg,#1d4d2b,#3a8f4f,#9cd36b,#f4f0a0)','linear-gradient(135deg,#4a1d5c,#a1347f,#ff7b9c,#ffd3a5)','linear-gradient(135deg,#2a1b3d,#44318d,#d83f87,#f8b400)','linear-gradient(135deg,#0b3d3a,#e0a030,#d1495b,#4a1d7a)'];
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
// two singers of one song: "A၊ B", "A & B", "A, B", "A နှင့် B", "A feat. B" -> each one is listed on his own
const ASEP=/\s*(?:၊|,|\/|&|\+|\bfeat\.?|\bft\.?|\bFeat\.?|\band\b|\sနှင့်\s)\s*/;
const artistsOf=s=>s.a?s.a.replace(/\)\s+(?=\S)/g,')၊').split(ASEP).map(x=>x.trim()).filter(Boolean):[];
const artistText=s=>artistsOf(s).join(' · ');
const gid=s=>s.g||s.id;      // versions of one song (other recordings, karaoke) share g: the list shows the song once, the versions are inside
let GRP={},GROUPS=[];
function buildGroups(){GRP={};SONGS.forEach(s=>{(GRP[gid(s)]=GRP[gid(s)]||[]).push(s)});GROUPS=Object.values(GRP);GROUPS.forEach(a=>a.sort((x,y)=>(x.k?1:0)-(y.k?1:0)||y.d-x.d))}
const vlab=s=>s.vl||fmt(s.d);
const inCol=(s,id)=>s.c===id||(s.x||[]).includes(id);   // one song can belong to more than one collection (field x = the extra ones)
function bgOf(s){const o=+lsGet('bg_'+s.id,-1);return BG[o>=0?o%BG.length:hash(s.c+s.id.slice(0,3))%BG.length]}
// ---------------- data
let D=null,SONGS=[],COLS={},CUR=null,QUEUE=[],tab='songs',flt={lyr:0,off:0,na:0},shown=150,OFF=new Set();
const AUD=new Audio();AUD.preload='none';
const collator=(()=>{try{return new Intl.Collator('my')}catch(e){return new Intl.Collator()}})();
fetch('data/songs.json?v='+DV).then(r=>r.json()).then(d=>{D=d;SONGS=d.songs;d.collections.forEach(c=>COLS[c.id]=c);buildGroups();
 SONGS.forEach(s=>{s._k=norm(s.t+' '+s.a+' '+[s.c,...(s.x||[])].map(i=>(COLS[i]||{}).name).join(' '))});
 $('#col').innerHTML='<option value="">စုစည်းမှုအားလုံး</option>'+d.collections.filter(c=>SONGS.some(s=>inCol(s,c.id))).map(c=>`<option value="${c.id}">${esc(c.name)} (${mn(SONGS.filter(s=>inCol(s,c.id)).length)})</option>`).join('');
 $('#sub').textContent=`သီချင်း ကဗျာ ${mn(SONGS.length)} ပုဒ် · စုစည်းမှု ${mn(d.collections.length)} ခု`;
 refreshOff().then(()=>{render();const h=location.hash.slice(1);if(h&&SONGS.find(s=>s.id===h))openSong(h,false)});
}).catch(()=>{$('#view').innerHTML='<div class="empty">အချက်အလက် မရရှိသေးပါ။ အင်တာနက် စစ်ပြီး ပြန်ကြိုးစားပါ။</div>'});
// ---------------- list
function filtered(){
 const q=norm($('#q').value),c=$('#col').value,so=$('#sort').value;
 let l=[];
 for(const a of GROUPS){if(q&&!a.some(s=>s._k.includes(q)))continue;const m=a.filter(s=>(!c||inCol(s,c))&&(!flt.lyr||s.l)&&(!flt.off||OFF.has(s.id))&&(!flt.na||s.n));if(m.length)l.push(m[0])}
 if(so==='title')l=[...l].sort((a,b)=>(a.n?1:0)-(b.n?1:0)||collator.compare(a.t,b.t));
 else if(so==='artist')l=[...l].sort((a,b)=>(a.a?0:1)-(b.a?0:1)||collator.compare(a.a,b.a)||collator.compare(a.t,b.t));
 else if(so==='long')l=[...l].sort((a,b)=>b.d-a.d);
 return l}
let IMGM=lsGet('songsImg','thumb');   // 'thumb' = small pictures (about 10 KB each, loaded only when visible), 'off' = no pictures at all
const thumb=o=>`img/t/${o.id}.jpg?v=${o.i}`;

// ---------------- offline (Cache API)
const CN='songs-audio-v1';
const aurl=s=>D.archive+s.f;
async function refreshOff(){try{const c=await caches.open(CN);OFF=new Set((await c.keys()).map(r=>r.url.split('/').pop().replace('.mp3','')))}catch(e){OFF=new Set()}}
async function saveOff(s,prog){
 const c=await caches.open(CN);if(await c.match(aurl(s)))return true;
 const r=await fetch(aurl(s));if(!r.ok)throw new Error('http '+r.status);
 const len=+r.headers.get('content-length')||s.z,rd=r.body.getReader(),parts=[];let got=0;
 for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;prog&&prog(got/len)}
 await c.put(aurl(s),new Response(new Blob(parts),{headers:{'content-type':'audio/mpeg'}}));OFF.add(s.id);return true}
async function delOff(s){const c=await caches.open(CN);await c.delete(aurl(s));OFF.delete(s.id)}
async function srcFor(s){try{const c=await caches.open(CN);const r=await c.match(aurl(s));if(r)return URL.createObjectURL(await r.blob())}catch(e){}return aurl(s)}

 else{$('#count').textContent='ကိုယ်ပိုင်စာရင်းများ — ကြိုက်သလို အစီအစဉ်ချနိုင်သည် (ဒီဖုန်း/ဘရောက်ဇာထဲမှာပဲ သိမ်းသည်)';
  $('#view').innerHTML='<div class="grid">'+LISTS.map(l=>`<div class="cc" style="background:${BG[hash(l.id)%BG.length]}"><b>${esc(l.name)}</b><small>${mn(l.ids.filter(id=>SONGS.some(s=>s.id===id)).length)} ပုဒ်</small><div style="margin-top:8px;display:flex;gap:6px"><button class="b2" data-lo="${l.id}">ဖွင့်ကြည့်</button><button class="b2" data-lr="${l.id}">✎</button>${l.id==='fav'?'':`<button class="b2" data-lx="${l.id}">🗑</button>`}</div></div>`).join('')+'</div><p><button class="b2 pri" id="lnew">➕ စာရင်းအသစ်</button></p>'}}

let batchStop=false;
async function batchSave(list){
 if(!confirm(`${mn(list.length)} ပုဒ် (${mb(list)}) ကို ဒေါင်းလုပ်လုပ်ပြီး ဖုန်းထဲ သိမ်းမည်။ အင်တာနက်ဒေတာ သုံးမည် — ဆက်မလား?`))return;

 for(const s of list){if(batchStop)break;B.innerHTML=`<div class="count">⏳ ${mn(n)} / ${mn(list.length)} — ${esc(s.t)} <button class="b2" id="bstop">ရပ်မည်</button></div><div class="pr" style="background:var(--line)"><i id="bpr" style="background:var(--accent)"></i></div>`;

  n++}
 B.innerHTML='';render();toast(batchStop?'ရပ်ထားသည်':`offline သိမ်းပြီး ${mn(n)} ပုဒ် ✓`)}

let repeat=+lsGet('songsRep',0),shuffle=+lsGet('songsShuf',0),objUrl=null;
async function play(s){CUR=s;if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
 const u=await srcFor(s);if(u.startsWith('blob:'))objUrl=u;AUD.src=u;
 try{await AUD.play()}catch(e){toast('ဖွင့်မရပါ — အင်တာနက် စစ်ပါ')}

 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.t,artist:artistText(s)||'ဓမ္မစကူးလ်',album:(COLS[s.c]||{}).name||''});
  navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));
  navigator.mediaSession.setActionHandler('play',()=>AUD.play());navigator.mediaSession.setActionHandler('pause',()=>AUD.pause())}}
function toggle(){AUD.paused?AUD.play():AUD.pause()}
const qIndex=q=>{let i=q.findIndex(x=>x.id===CUR.id);return i>=0?i:q.findIndex(x=>gid(x)===gid(CUR))};
function step(d){if(!CUR)return;const q=QUEUE.length?QUEUE:GROUPS.map(a=>a[0]);let i=qIndex(q);
 if(shuffle)i=Math.floor(Math.random()*q.length);else i=(i+d+q.length)%q.length;play(q[i])}
AUD.onended=()=>{if(repeat===1){AUD.currentTime=0;AUD.play()}else{const q=QUEUE.length?QUEUE:GROUPS.map(a=>a[0]);const i=qIndex(q);if(repeat===2||shuffle||i<q.length-1)step(1);else paint()}};

 $('#cm').open=false;$('#cmbody').innerHTML='';$('#cmn').textContent='';cmLoaded=null}
$('#nver').onclick=e=>{const b=e.target.closest('[data-ver]');if(b)openSong(b.dataset.ver,true)};
$('#nclose').onclick=()=>{$('#np').close();history.replaceState(null,'',location.pathname+location.search)};
$('#np').addEventListener('click',e=>{if(e.target===$('#np'))$('#nclose').click()});
$('#nbg').onclick=()=>{const o=(+lsGet('bg_'+NP.id,hash(NP.c+NP.id.slice(0,3))%BG.length)+1)%BG.length;lsSet('bg_'+NP.id,o);$('#npb').style.setProperty('--g',BG[o]);paint()};
let fz=+lsGet('songsFz',1.06);const setFz=()=>{$('#nlyr').style.fontSize=fz+'rem'};setFz();
$('#fsp').onclick=()=>{fz=Math.min(2,fz+.12);lsSet('songsFz',fz);setFz()};$('#fsm').onclick=()=>{fz=Math.max(.8,fz-.12);lsSet('songsFz',fz);setFz()};
$('#nshare').onclick=async()=>{const u=location.origin+location.pathname+'#'+NP.id;try{await navigator.clipboard.writeText(u);toast('လင့်ခ် ကူးပြီးပါပြီ')}catch(e){prompt('ဒီလင့်ခ်ကို ကူးပါ',u)}};
$('#noff').onclick=async()=>{const s=NP;
 if(OFF.has(s.id)){await delOff(s);$('#noff').textContent='⬇ offline သိမ်းမည်';render();toast('offline ဖျက်ပြီး');return}
 const pr=$('#npr');pr.hidden=false;$('#noff').disabled=true;
 try{await saveOff(s,p=>pr.firstChild.style.width=(p*100)+'%');$('#noff').textContent='🗑 offline ဖျက်မည်';render();toast('offline သိမ်းပြီးပါပြီ ✓')}
 catch(e){toast('သိမ်းမရပါ — အင်တာနက်/နေရာ စစ်ပါ')}
 pr.hidden=true;$('#noff').disabled=false};

const FB={apiKey:"AIzaSyCFwHPLW6VnQqgM-ZrisQZZaBLVrm88e9M",authDomain:"myanmardhammaclass.firebaseapp.com",projectId:"myanmardhammaclass",appId:"1:779222889065:web:8afbe9348c3314bef3a8f8"};
const APP='dhamma-songs',V='11.6.1';let fbp=null,cmLoaded=null;
function fb(){return fbp||(fbp=(async()=>{const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),Au=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
 const app=A.initializeApp(FB,'songs'),auth=Au.getAuth(app);await Au.signInAnonymously(auth);return {F,db:F.getFirestore(app),col:F.collection(F.getFirestore(app),`artifacts/${APP}/public/data/song_comments`)}})())}
const mine=()=>{try{return JSON.parse(lsGet('songsMine','[]'))}catch(e){return[]}};
const isAdmin=()=>lsGet('songsAdmin','')==='1'||location.search.includes('admin=1');
async function loadCm(){const id=NP.id;if(cmLoaded===id)return;cmLoaded=id;const B=$('#cmbody');B.innerHTML='<p>ဖတ်နေသည်…</p>';
 try{const {F,col}=await fb();const sn=await F.getDocs(F.query(col,F.where('song','==',id)));
  const items=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));if(NP.id!==id)return;
  $('#cmn').textContent=items.length?'('+mn(items.length)+')':'';
  B.innerHTML=`<input id="cname" maxlength="40" placeholder="နာမည် (မဖြည့်လည်းရ)" value="${esc(lsGet('songsName',''))}"><textarea id="ctext" rows="2" maxlength="3000" placeholder="မှတ်ချက် ရေးပါ… (သီချင်းစာသား သိရင် ဒီမှာ ထည့်ပေးပါ)"></textarea><label style="display:block;margin:4px 0"><input type="checkbox" id="clyr"> 📝 ဒါက ဒီသီချင်းရဲ့ စာသား (ဆရာက စစ်ပြီး မှန်ရင် သုံးပါမည်)</label><button class="send" id="csend">ပို့မည်</button><div id="clist">${items.map(c=>cmItem(c)).join('')||'<p style="opacity:.8">မှတ်ချက် မရှိသေးပါ</p>'}</div>`;
  $('#csend').onclick=async()=>{const t=$('#ctext').value.trim();if(!t)return;const n=$('#cname').value.trim().slice(0,40);lsSet('songsName',n);$('#csend').disabled=true;
   try{const kind=$('#clyr').checked?'lyrics':'comment';const r=await F.addDoc(col,{song:id,name:n,text:t.slice(0,3000),kind,ts:Date.now()});if(kind==='lyrics')toast('စာသား ပေးပို့ပြီးပါပြီ — ကျေးဇူးတင်ပါသည်');const m=mine();m.push(r.id);lsSet('songsMine',JSON.stringify(m));cmLoaded=null;loadCm()}catch(e){toast('မပို့နိုင်ပါ');$('#csend').disabled=false}};
  $('#clist').onclick=async e=>{const b=e.target.closest('[data-del]');if(!b||!confirm('ဖျက်မလား?'))return;try{await F.deleteDoc(F.doc(col,b.dataset.del));cmLoaded=null;loadCm()}catch(e2){toast('မဖျက်နိုင်ပါ')}}}
 catch(e){B.innerHTML='<p>မှတ်ချက်များ မဖွင့်နိုင်သေးပါ (အင်တာနက် စစ်ပါ)။</p>';cmLoaded=null}}
function cmItem(c){const ok=mine().includes(c.id)||isAdmin();return `<div class="item">${ok?`<button class="del" data-del="${c.id}">🗑</button>`:''}<small>${esc(c.name||'အမည်မသိ')} · ${c.ts?new Date(c.ts).toLocaleDateString('my'):''}${c.kind==='lyrics'?' · 📝 စာသားပေးပို့ချက်':''}</small><p>${esc(c.kind==='lyrics'&&c.text.length>200?c.text.slice(0,200)+'…':c.text)}</p></div>`}
$('#cm').addEventListener('toggle',()=>{if($('#cm').open&&NP)loadCm()});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
