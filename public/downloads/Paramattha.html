e ultimate sense, such as phassa, nāma or rūpa.","Vijj."],2:["Avijjamāna-paññatti","A word for something that does not exist in the ultimate sense, such as a mountain or the earth.","Avijj."],3:["Vijjamānena avijjamāna-paññatti",'An existing thing used to indicate a non-existing one, such as "one with the six higher knowledges" (chaḷabhiñña).',"Vijj./Avijj."],4:["Avijjamānena vijjamāna-paññatti",'A non-existing thing used to indicate an existing one, such as "a woman’s voice" (itthisadda).',"Avijj./Vijj."],5:["Vijjamānena vijjamāna-paññatti",'Two existing things together, such as "eye-consciousness" (cakkhuviññāṇa).',"Vijj./Vijj."],6:["Avijjamānena avijjamāna-paññatti",'Two non-existing things together, such as "a king’s son" (rājaputta).',"Avijj./Avijj."]},Zh=(e,t,a)=>a!=="en"?e:e.map(n=>t[n.id]?{...n,name:t[n.id][0],desc:t[n.id][1],short:t[n.id][2]}:n),Iv=(e,t)=>Zh(e,sx,t),_v=(e,t)=>Zh(e,ox,t),Nv=(e,t)=>Zh(e,lx,t),Sv={"နိဗ္ဗာန်":"Nibbāna","ပညတ်":"Paññatti","အတ္ထပညတ် (၆)":"Attha-paññatti (6)","သဒ္ဒပညတ် (၆)":"Sadda-paññatti (6)"};function Cv(e,t){return t==="en"&&Sv[e]?Sv[e]:e}var ux={rupakkhandha:"Rūpakkhandha",vedanakkhandha:"Vedanākkhandha",sannakkhandha:"Saññākkhandha",sankharakkhandha:"Saṅkhārakkhandha (50)",vinnanakkhandha:"Viññāṇakkhandha",khandhavimutta:"Khandhavimutta",rupupadanakkhandha:"Rūpupādānakkhandha",vedanupadanakkhandha:"Vedanupādānakkhandha",sannupadanakkhandha:"Saññupādānakkhandha",sankharupadanakkhandha:"Saṅkhārupādānakkhandha",vinnanupadanakkhandha:"Viññāṇupādānakkhandha",upadanakkhandhavimutta:"Upādānakkhandhavimutta",cakkhayatana:"Cakkhāyatana",sotayatana:"Sotāyatana",ghanayatana:"Ghānāyatana",jivhayatana:"Jivhāyatana",kayayatana:"Kāyāyatana",rupayatana:"Rūpāyatana",saddayatana:"Saddāyatana",gandhayatana:"Gandhāyatana",rasayatana:"Rasāyatana",photthabbayatana:"Phoṭṭhabbāyatana",manayatana:"Manāyatana",dhammayatana:"Dhammāyatana",cakkhudhatu:"Cakkhudhātu",sotadhatu:"Sotadhātu",ghanadhatu:"Ghānadhātu",jivhadhatu:"Jivhādhātu",kayadhatu:"Kāyadhātu",rupadhatu:"Rūpadhātu",saddadhatu:"Saddadhātu",gandhadhatu:"Gandhadhātu",rasadhatu:"Rasadhātu",photthabbadhatu:"Phoṭṭhabbadhātu",cakkhuvinnanadhatu:"Cakkhuviññāṇadhātu",sotavinnanadhatu:"Sotaviññāṇadhātu",ghanavinnanadhatu:"Ghānaviññāṇadhātu",jivhavinnanadhatu:"Jivhāviññāṇadhātu",kayavinnanadhatu:"Kāyaviññāṇadhātu",manodhatu:"Manodhātu",manovinnanadhatu:"Manoviññāṇadhātu",dhammadhatu:"Dhammadhātu",dukkhasacca:"Dukkhasacca",samudayasacca:"Samudayasacca",nirodhasacca:"Nirodhasacca",maggasacca:"Maggasacca",saccavimutta:"Saccavimutta"},cx={khandhavimutta:"Nibbāna is free from the count of the aggregates, because it has no division into the eleven kinds.",vedanupadanakkhandha:"Only the 81 mundane cittas are associated here.",sannupadanakkhandha:"Only the 81 mundane cittas are associated here.",sankharupadanakkhandha:"Only the 81 mundane cittas are associated here.",vinnanupadanakkhandha:"Only the 81 mundane cittas are included.",upadanakkhandhavimutta:"The 8 lokuttara cittas, their 36 associated cetasikas and Nibbāna are free from the clinging-aggregates.",saccavimutta:"The remaining 29 magga cittuppādas [= 28 cetasikas other than the eight path factors + 1 magga citta] and the 37 phala cittuppādas [= 36 cetasikas + 1 phala citta] are outside the count of the four truths."},dx={khandha:"Khandha (5)",upadanakkhandha:"Upādānakkhandha (5)",ayatana:"Āyatana (12)",dhatu:"Dhātu (18)",sacca:"Sacca (4)"};function Pv(e,t){return t!=="en"?e:e.map(a=>({...a,name:dx[a.id]||a.name,items:a.items.map(n=>({...n,name:ux[n.id]||n.name,note:n.note&&cx[n.id]||n.note}))}))}var hx={asava:["Āsava (4)","Four unwholesome states that flow on and on through the sense objects like a discharge from a sore, and that spread as far as the highest existence.",[["Kāmāsava","Greed for the five sense pleasures."],["Bhavāsava","Greed that delights in the rūpa and arūpa existences (attachment to jhāna existence)."],["Diṭṭhāsava","Wrong view, in its 62 kinds."],["Avijjāsava","Delusion: ignorance of the four truths, the past and future aggregates, dependent origination and so on (8 matters)."]]],ogha:["Ogha (4)","Four unwholesome states that sweep beings along and sink them, like a flood.",[["Kāmogha","Greed for sense pleasures: it drowns beings like a flood."],["Bhavogha","Greed delighting in existence: it drowns beings like a flood."],["Diṭṭhogha","Wrong view: it drowns beings like a flood."],["Avijjogha","Ignorance (moha): it drowns beings like a flood."]]],yoga:["Yoga (4)","Four unwholesome states that yoke beings to the suffering of the round of rebirths and to the machine of existence.",[["Kāmayoga","Greed for sense pleasures: it yokes beings to the suffering of saṃsāra."],["Bhavayoga","Greed delighting in existence: it yokes beings to the suffering of saṃsāra."],["Diṭṭhiyoga","Wrong view: it yokes beings to the suffering of saṃsāra."],["Avijjāyoga","Ignorance (moha): it yokes beings to the suffering of saṃsāra."]]],gantha:["Gantha (4)","Four knots that tie the mental body and the physical body together.",[["Abhijjhā-kāyagantha","Craving (greed): it binds the mental and physical body."],["Byāpāda-kāyagantha","Aversion (dosa): it binds through ill will."],["Sīlabbataparāmāsa-kāyagantha","Wrong view that clings to rites and rituals (such as the cow-practice) as a way of purification."],["Idaṃsaccābhinivesa-kāyagantha",'Wrong view that clings firmly to "this alone is the truth".']]],upadana:["Upādāna (4)","Four states that grasp the object tightly, as a snake holds fast to what it has caught.",[["Kāmupādāna","Sensual craving (greed): it holds fast to the sense pleasures."],["Diṭṭhupādāna","Wrong view: firmly clinging to a mistaken opinion."],["Sīlabbatupādāna","Clinging to the cow-virtue, cow-practice and the like as a way of purification from saṃsāra."],["Attavādupādāna","The view that takes the five clinging-aggregates to be a self."]]],nivarana:["Nīvaraṇa (6)","Six hindrances that obstruct wholesome cittas and cover the eye of wisdom.",[["Kāmacchanda-nīvaraṇa","Strong attachment to sense pleasures (rāga + desire): it obstructs the wholesome."],["Byāpāda-nīvaraṇa","Ill will (dosa): it obstructs the wholesome."],["Thinamiddha-nīvaraṇa","Dullness of mind (thina + middha): it obstructs the wholesome."],["Uddhacca-kukkucca-nīvaraṇa","Restlessness and worry (uddhacca + kukkucca): they obstruct the wholesome."],["Vicikicchā-nīvaraṇa","Doubt: it obstructs the wholesome."],["Avijjā-nīvaraṇa","Ignorance (moha): it covers the eye of wisdom."]]],anusaya:["Anusaya (7)","Seven latent tendencies that lie dormant in a being’s continuum and arise again and again until they are removed by the path.",[["Kāmarāgānusaya","Craving for sense pleasures: it keeps arising until removed by the path."],["Bhavarāgānusaya","Craving for existence: it keeps arising until removed by the path."],["Paṭighānusaya","Aversion (dosa): it keeps arising until removed by the path."],["Mānānusaya","Conceit (māna): it keeps arising until removed by the path."],["Diṭṭhānusaya","Wrong view: it keeps arising until removed by the path."],["Vicikicchānusaya","Doubt: it keeps arising until removed by the path."],["Avijjānusaya","Ignorance (moha): it keeps arising until removed by the path."]]],"samyojana-suttanta":["Saṃyojana (10), Suttanta","Ten fetters that bind beings in the prison of saṃsāra with the ropes of various objects (Suttanta method).",[["Kāmarāga-saṃyojana","Craving for sense pleasures: it binds beings to saṃsāra."],["Rūparāga-saṃyojana","Delight in the rūpa existence: it binds beings to saṃsāra."],["Arūparāga-saṃyojana","Delight in the arūpa existence: it binds beings to saṃsāra."],["Paṭigha-saṃyojana","Aversion (dosa): it binds beings to saṃsāra."],["Māna-saṃyojana","Conceit (māna): it binds beings to saṃsāra."],["Diṭṭhi-saṃyojana","Wrong view: it binds beings to saṃsāra."],["Sīlabbataparāmāsa-saṃyojana","Wrong view that clings to the cow-practice and the like as purification."],["Vicikicchā-saṃyojana","Doubt: it binds beings to saṃsāra."],["Uddhacca-saṃyojana","Restlessness: it binds beings to saṃsāra."],["Avijjā-saṃyojana","Ignorance (moha): it binds beings to saṃsāra."]]],"samyojana-abhidhamma":["Saṃyojana (10), Abhidhamma","Ten fetters that bind beings to saṃsāra (Abhidhamma method, which includes issā and macchariya).",[["Kāmarāga-saṃyojana","Craving for sense pleasures (Abhidhamma method)."],["Bhavarāga-saṃyojana","Craving for existence (Abhidhamma method)."],["Paṭigha-saṃyojana","Aversion (dosa) (Abhidhamma method)."],["Māna-saṃyojana","Conceit (māna) (Abhidhamma method)."],["Diṭṭhi-saṃyojana","Wrong view (Abhidhamma method)."],["Sīlabbataparāmāsa-saṃyojana","Wrong view that clings to the cow-practice and the like as purification (Abhidhamma method)."],["Vicikicchā-saṃyojana","Doubt (Abhidhamma method)."],["Issā-saṃyojana","Envy: resentment at the good fortune of others."],["Macchariya-saṃyojana","Stinginess: hiding one’s own wealth and being unable to bear sharing it with others."],["Avijjā-saṃyojana","Ignorance (moha) (Abhidhamma method)."]]],kilesa:["Kilesa (10)","Ten defilements that torment and oppress the mind.",[["Lobha",'Grasping at "I" and "mine" with craving: it torments the mind.'],["Dosa","Harshness and roughness of mind: it torments the mind."],["Moha","Not knowing the true nature of things: it torments the mind."],["Māna",'Pride, the lifting up of oneself as "I, I": it torments the mind.'],["Diṭṭhi","Wrong view: it torments the mind."],["Vicikicchā","Doubt: it torments the mind."],["Thina","Sluggishness of mind: it torments the mind."],["Uddhacca","Restless, scattered mind: it torments the mind."],["Ahirika","Shamelessness toward misconduct: it torments the mind."],["Anottappa","Fearlessness toward misconduct: it torments the mind."]]]},mx={hetu6:["Hetu (6)","Six roots: states that make the things associated with them firm and stable, like the root of a tree.",[["Lobha","Craving and clinging: an unwholesome root."],["Dosa","Roughness and harshness: an unwholesome root."],["Moha","Not knowing the true nature of things: an unwholesome root."],["Alobha","Non-greed: a wholesome / indeterminate root."],["Adosa","Non-aversion: a wholesome / indeterminate root."],["Amoha","Knowing and seeing with wisdom: a wholesome / indeterminate root."]]],jhananga:["Jhānaṅga (7)","Seven jhāna factors, which look closely at the object. The ten dvi-pañcaviññāṇa cittas have no jhāna factors.",[["Vitakka","Applying the mind to the object (thinking)."],["Vicāra","Examining the object again and again."],["Pīti","Delighting in the object."],["Ekaggatā","One-pointedness: steadiness on a single object."],["Somanassa","Feeling (vedanā) as a jhāna factor of the wholesome: joy (only in cittas associated with somanassa)."],["Domanassa","Feeling (vedanā) as a jhāna factor of the unwholesome: mental pain (only in cittas associated with domanassa)."],["Upekkhā","Feeling (vedanā): neutral feeling (only in cittas associated with upekkhā)."]]],magganga12:["Maggaṅga (12)","Twelve factors that lead to a happy rebirth, a woeful rebirth or Nibbāna (8 right + 4 wrong). The 18 ahetuka cittas have no path factors at all.",[["Sammā-diṭṭhi","Right view: seeing rightly (wisdom)."],["Sammā-saṅkappa","Right thought: thinking rightly (vitakka)."],["Sammā-vācā","Right speech."],["Sammā-kammanta","Right action."],["Sammā-ājīva","Right livelihood."],["Sammā-vāyāma","Right effort (vīriya)."],["Sammā-sati","Right mindfulness (sati)."],["Sammā-samādhi","Right concentration (ekaggatā). In the vicikicchā citta it does not count as a path factor."],["Micchā-diṭṭhi","Wrong view (diṭṭhi): a wrong path factor leading to a woeful rebirth."],["Micchā-saṅkappa","Thinking (vitakka) on the unwholesome side."],["Micchā-vāyāma","Effort (vīriya) on the unwholesome side."],["Micchā-samādhi","One-pointedness (ekaggatā) on the unwholesome side. In the vicikicchā citta it does not count as a path factor."]]],indriya22:["Indriya (22)","Twenty-two faculties: states that exercise control, each in its own sphere.",[["Cakkhundriya","The eye sensitivity (pasāda rūpa)."],["Sotindriya","The ear sensitivity (pasāda rūpa)."],["Ghānindriya","The nose sensitivity (pasāda rūpa)."],["Jivhindriya","The tongue sensitivity (pasāda rūpa)."],["Kāyindriya","The body sensitivity (pasāda rūpa)."],["Itthindriya","The female sex faculty (bhāva rūpa)."],["Purisindriya","The male sex faculty (bhāva rūpa)."],["Jīvitindriya","The life faculty (jīvita rūpa), which sustains the rūpa."],["Manindriya","All cittas: the control exercised by consciousness."],["Sukhindriya","The feeling (vedanā) cetasika: bodily pleasure."],["Dukkhindriya","The feeling (vedanā) cetasika: bodily pain."],["Somanassindriya","The feeling (vedanā) cetasika: mental joy."],["Domanassindriya","The feeling (vedanā) cetasika: mental pain."],["Upekkhindriya","The feeling (vedanā) cetasika: neutral feeling."],["Saddhindriya","Faith: the saddhā cetasika."],["Vīriyindriya","Effort: the vīriya cetasika."],["Satindriya","Mindfulness: the sati cetasika."],["Samādhindriya","One-pointedness: the ekaggatā cetasika. It does not count as a faculty in the 16 cittas (10 dvi-pañcaviññāṇa + 3 manodhātu + 3 santīraṇa) or in the vicikicchā citta."],["Paññindriya","Penetrating knowledge: the paññā cetasika."],["Anaññātaññassāmītindriya","Wisdom: the paññindriya found only in the Sotāpatti-magga citta."],["Aññindriya","Wisdom: the paññindriya found in the upper three paths and the lower three fruits."],["Aññātāvindriya","Wisdom: the paññindriya found only in the Arahatta-phala citta."]]],bala9:["Bala (9)","Nine powers: states that cannot be shaken by their opposites. The 16 cittas without vīriya have no powers.",[["Saddhā-bala","Firmness of faith."],["Vīriya-bala","Firmness of effort."],["Sati-bala","Firmness of mindfulness."],["Samādhi-bala","Firmness of concentration. In the vicikicchā citta it does not count as a power."],["Paññā-bala","Firmness of wisdom."],["Hirī-bala","Firmness of shame of misconduct."],["Ottappa-bala","Firmness of fear of misconduct."],["Ahirika-bala",  သဘော":"Leading the mind onward","အာရုံကို အဖန်ဖန် သုံးသပ်ဆင်ခြင်ခြင်းသဘော":"The nature of examining the object again and again","အဖန်ဖန် ယှဉ်ကပ်စေခြင်း":"Keeping the mind connected with the object again and again","စိတ်ကို အစဉ်မပြတ်အောင် ဖွဲ့စပ်တတ်သော သဘော":"Keeping the mind continuous (unbroken)","အာရုံကို သန္နိဋ္ဌာန်ကျ ဆုံးဖြတ်ချက်ချခြင်းသဘော":"The nature of firmly deciding about the object","ဝိစိကိစ္ဆာ၏ ဆန့်ကျင်ဘက် ဖြစ်ခြင်း":"Being the opposite of vicikicchā (doubt)","အာရုံကို ဆုံးဖြတ်တတ်သော သဘောတရား":"The nature of deciding the object","ဆုံးဖြတ်အပ်သော အာရုံဓမ္မ":"The object that is to be decided","လွန်စွာ လုံ့လပြုခြင်းသဘော":"The nature of making a strong effort","သဟဇာတ်တရားတို့ကို အားပေးထောက်ပံ့ခြင်း":"Supporting and upholding the co-nascent states","မဆုတ်နစ်တတ်သော သဘောတရား":"The nature of not giving way","သံဝေဂဉာဏ်":"Saṃvega (a sense of urgency)","အာရုံကို နှစ်သက်ခြင်း သဘော":"The nature of delighting in the object","ကိုယ်စိတ်နှစ်ပါးကို နှစ်သက်ပြည့်ဖြိုး ပွားတိုးစေခြင်း":"Refreshing and increasing body and mind","ရွှင်လန်းတက်ကြွစေတတ်သော သဘောတရား":"The nature of joyful elation","အာရုံကို ပြုလုပ်လိုခြင်းသဘော":"The nature of wishing to do (wanting) the object","အာရုံကို ရှာမှီးခြင်း":"Searching for the object","အာရုံကို လိုလားတောင့်တမှုသဘောတရား":"The nature of longing for the object","အလိုရှိအပ်သော အာရုံ":"The object that is wished for","သဘာဝမှန်ကို ဟုတ်တိုင်းမှန်စွာ မသိမမြင်နိုင်ခြင်း":"The nature of not knowing the true nature as it really is","အာရုံ၏ သဘောမှန်ကို ဖုံးလွှမ်းခြင်း":"Covering the true nature of the object","မသင့်မလျော်သော ပဋိပတ်ကျင့်စဉ်ကို ဖြစ်စေတတ်သည်":"Causing wrong practice",အယောနိသောမနသိကာရ:"Ayoniso manasikāra","အကုသိုလ်တရားတို့ကို မစက်ဆုပ်ခြင်းသဘော":"The nature of not feeling disgust at unwholesome states","မရှက်သော အခြင်းအရာအားဖြင့် ပြုခြင်း":"Acting without shame","မကောင်းမှုမှ မတွန့်ဆုတ်တတ်သော သဘော":"Not shrinking back from evil","မိမိကိုယ်ကို မရိုသေခြင်း":"Lack of respect for oneself","အကုသိုလ်တရားတို့ကို မကြောက်ရွံ့ခြင်းသဘော":"The nature of not fearing unwholesome states","မထိတ်လန့်သော အခြင်းအရာအားဖြင့် ပြုခြင်း":"Acting without fear of wrongdoing","သူတစ်ပါးတို့၌ မရိုသေခြင်း":"Lack of respect for others","စိတ် မငြိမ်သက်ခြင်းသဘောတရား":"The nature of restlessness of mind","စိတ်ငြိမ်ဝပ်စွာ မတည်တံ့ခြင်း":"Not staying settled and calm","စိတ် မရပ်မတည် တုန်လှုပ်တတ်သည့်သဘော":"The nature of a mind that is unsteady and agitated","အာရုံကို ငါ့ဟာဟူ၍ စွဲယူခြင်းသဘော":"The nature of grasping the object as 'mine'","အာရုံ၌ အလွန်ငြိကပ်ခြင်း":"Sticking fast to the object","အာရုံကို မစွန့်လွှတ်နိုင်ခြင်း သဘော":"Being unable to let go of the object","သာယာဖွယ် သုဘဟု ရှုမြင်တတ်သော ဒိဋ္ဌိ":"Diṭṭhi that sees things as pleasant and beautiful","နိစ္စ သုခ အတ္တ သုဘဟု မှားမှားယွင်းယွင်း နှလုံးသွင်းခြင်းသဘော":"The nature of wrongly taking things to be permanent, pleasant, self and beautiful","မှားသောအားဖြင့် သုံးသပ်ခြင်း":"Wrongly interpreting","စွဲမြဲစွာ နှလုံးသွင်းတတ်သော သဘော":"The nature of firmly holding the view","အရိယာတို့ကို ဖူးမြင်ခြင်းငှာ အလိုမရှိသူဖြစ်ခြင်း":"Not wishing to see the noble ones","ထောင်လွှား တက်ကြွခြင်းသဘော":"The nature of haughtiness and arrogance","သမ္ပယုတ်တရားတို့ကို ချီးမြှောက်ခြင်း":"Exalting the associated states","အရာရာတွင် အသာယူလိုသည့် သဘောတရား":"The nature of wanting to be superior in everything","ဒိဋ္ဌိနှင့် မယှဉ်သော လောဘ":"Lobha dissociated from diṭṭhi","စိတ် ရုန့်ရင်း ခက်ထန်ကြမ်းတမ်းခြင်းသဘော":"The nature of harshness and ferocity of mind","ကိုယ်စိတ်ကို ပြင်းစွာ လောင်ကျွမ်းခြင်း":"Burning body and mind fiercely","အကျိုးစီးပွားကို ဖျက်ဆီးတတ်သော သဘော":"Destroying one's own welfare",အာဃာတဝတ္ထု:"The grounds of resentment (āghāta-vatthu)","သူတစ်ပါးတို့၏ စည်းစိမ်တို့ကို ငြူစူခြင်းသဘော":"The nature of envy of others' prosperity","မမွေ့လျော်နိုင်ခြင်း":"Being unable to rejoice in it","မျက်နှာလွှဲတတ်သော သဘောတရား":"Turning away","သူတစ်ပါးတို့၏ စည်းစိမ်":"The prosperity of others","မိမိ၏ စည်းစိမ်တို့ကို လျှို့ဝှက်ခြင်းသဘော":"The nature of hiding one's own prosperity","သူတစ်ပါးတို့နှင့် ဆက်ဆံမှုကို သည်းမခံနိုင်ခြင်း":"Being unable to bear sharing it with others","တွန့်တိုခြင်းသဘောတရား":"The nature of stinginess","မိမိ၏ စည်းစိမ်ဥစ္စာ":"One's own wealth and property","နောင်တတစ်ဖန် ပူပန်ခြင်းသဘော":"The nature of repeated remorse","အဖန်တလဲလဲ ဝမ်းနည်းခြင်း စိုးရိမ်ခြင်း":"Repeatedly grieving and worrying","စိတ်နှလုံးပူပန်လျက် အဖန်ဖန် အောက်မေ့ခြင်း":"Repeatedly brooding with an anxious heart","ပြုပြီး ဒုစရိုက်၊ မပြုလိုက်မိသော သုစရိုက်":"Misconduct done and good conduct left undone","အားမထုတ်ခြင်းသဘော = အားတက်သရော မရှိခြင်းသဘော":"The nature of lack of effort = lack of enthusiasm","ဝီရိယကို ဖျက်ဆီးခြင်း":"Destroying vīriya","ဆုတ်နစ်တတ်သော သဘောတရား":"The nature of sinking down","ပျင်းရိခြင်း":"Laziness","မခံ့ညားသည်၏ အဖြစ်ဟူသော သဘော":"The nature of unwieldiness","ဝိညာဏ် ဒွါရတို့ကို ပိတ်ထားခြင်း":"Closing the doors of consciousness","အာရုံကို ယူခြင်း၌ တွန့်ဆုတ်တတ်သော သဘောတရား":"The nature of shrinking from taking the object","ယုံမှားခြင်းသဘော":"The nature of doubting","စိတ်၏ တုန်လှုပ်ခြင်း":"Wavering of the mind","အာရုံကို မဆုံးဖြတ်နိုင်ခြင်း":"Being unable to decide about the object","သဒ္ဓေယျဝတ္ထုကို ယုံကြည်ခြင်းသဘော":"The nature of having confidence in what is worthy of confidence","သမ္ပယုတ်တရားတို့ကို ကြည်လင်စေခြင်း":"Making the associated states clear and bright","မနောက်ကျုသည်၏ အဖြစ်ဟူသော သဘောတရား":"The nature of being free from stain","ယုံကြည်ထိုက်သော သဒ္ဓေယျဝတ္ထု":"An object worthy of confidence","အာရုံ၌ မြဲစွာ အောက်မေ့စေခြင်းသဘော":"The nature of firmly keeping the object in mind","မေ့လျော့ခြင်း ပမာဒကို ဖျက်ဆီးခြင်း":"Destroying forgetfulness and heedlessness","စိတ်ကို စောင့်ရှောက်တတ်သော သဘောတရား":"The nature of guarding the mind","မြဲမြံသော အမှတ်သညာ":"Firm perception (saññā)","မကောင်းမှုမှ စက်ဆုပ်ခြင်းသဘော":"The nature of disgust at evil","ရှက်သော အခြင်းအရာအားဖြင့် မကောင်းမှုတို့ကို မပြုခြင်း":"Not doing evil through shame","မကောင်းမှုမှ တွန့်ဆုတ်တတ်သော သဘော":"Shrinking back from evil","မိမိကိုယ်ကို ရိုသေလေးစားခြင်း":"Respect and regard for oneself","မကောင်းမှုမှ ထိတ်လန့်ခြင်းသဘော":"The nature of dread of evil","ထိတ်လန့်သော အခြင်းအရာအားဖြင့် မကောင်းမှုတို့ကို မပြုခြင်း":"Not doing evil through fear of it","သူတစ်ပါးကို ရိုသေလေးစားခြင်း":"Respect and regard for others","အာရုံ၌ စိတ်၏ မတပ်မက်ခြင်းသဘော":"The nature of the mind not being greedy for the object","မသိမ်းပိုက်ခြင်း":"Not taking hold of it","အာရုံ၌ မငြိကပ်လိုသော သဘော":"The wish not to cling to the object",ယောနိသောမနသိကာရ:"Yoniso manasikāra","သတ္တဝါတို့၏ အကျိုးစီးပွားကို ကျင့်သော အခြင်းအရာအားဖြင့် ဖြစ်ခြင်း လက္ခဏာရှိ၏":"The nature of acting for the welfare of beings","သတ္တဝါတို့၏ အကျိုးစီးပွားကို ကပ်၍ ဆောင်ခြင်း ရှိ၏":"Bringing welfare to beings","ရန်ငြိုးဖွဲ့ခြင်းကို ပယ်ဖျောက်တတ်သော သဘောတရားဟု ဉာဏ်အား ထင်တတ်၏":"Removing resentment: it appears to wisdom as that which dispels ill will","သတ္တဝါတို့၏ မြတ်နိုးဖွယ်ရာ မနာပကိုသာ ရှုမြင်တတ်သော ယောနိသောမနသိကာရ":"Yoniso manasikāra that sees only what is lovable in beings","သတ္တဝါတို့၌ အလယ်အလတ်သဘောရှိသော လျစ်လျူရှုခြင်းဟူသော အခြင်းအရာအားဖြင့် ဖြစ်ခြင်းသဘော":"The nature of neutrality toward beings","မုန်းခြင်း ချစ်ခြင်းသို့ မကျရောက်ဘဲ ညီမျှသည်၏ အဖြစ်ကိုသာ ရှုခြင်း":"Seeing evenly, without falling into hatred or love","သတ္တဝါတို့၌ မုန်းခြင်း ချစ်ခြင်းတို့ကို ငြိမ်းစေခြင်းကို ဖြစ်စေတတ်၏":"It brings about the calming of hatred and love toward beings","ကံသာလျှင် မိမိ၏ ကိုယ်ပိုင်ဥစ္စာ ရှိသည်၏ အဖြစ်ကို ရှုတတ်သော ဉာဏ်":"The knowledge that sees 'beings are owners of their kamma'","စေတသိက်ပူတို့ကို ငြိမ်းအေးစေခြင်းသဘော":"The nature of calming the heat of the cetasikas","စေတသိက်ပူတို့ကို ဖျက်ဆီးခြင်း":"Crushing the heat of the cetasikas","စေတသိက်တို့၏ ငြိမ်သက် အေးမြသော သဘော":"The nature of calm, coolness of the cetasikas","စိတ်ပူတို့ကို ငြိမ်းအေးစေခြင်းသဘော":"The nature of calming the heat of the citta","စိတ်ပူတို့ကို ဖျက်ဆီးခြင်း":"Crushing the heat of the citta","စိတ်၏ ငြိမ်သက် အေးမြသော သဘော":"The nature of calm, coolness of the citta","စေတသိက်တို့၏ လေးလံမှုကို ငြိမ်းအေးစေခြင်းသဘော":"The nature of calming the heaviness of the cetasikas","စေတသိက်တို့၏ လေးလံမှုကို ဖျက်ဆီးခြင်း":"Crushing the heaviness of the cetasikas","မလေးမလံ မနှေးကန်သည့် သဘော":"The nature of lightness, not sluggish","စိတ်၏ လေးလံမှုကို ငြိမ်းအေးစေခြင်းသဘော":"The nature of calming the heaviness of the citta","စိတ်၏ လေးလံမှုကို ဖျက်ဆီးခြင်း":"Crushing the heaviness of the citta","စေတသိက်တို့၏ ခက်ထန်ခိုင်မာမှုကို ငြိမ်းအေးစေခြင်း":"Calming the stiffness and hardness of the cetasikas","စေတသိက်တို့၏ ခက်ထန်ခိုင်မာမှုကို ဖျက်ဆီးခြင်း":"Crushing the stiffness and hardness of the cetasikas","မထိခိုက်သောသဘော":"The nature of non-resistance","စိတ်၏ ခက်ထန်ခိုင်မာမှုကို ငြိမ်းအေးစေခြင်း":"Calming the stiffness and hardness of the citta","စိတ်၏ ခက်ထန်ခိုင်မာမှုကို ဖျက်ဆီးခြင်း":"Crushing the stiffness and hardness of the citta","စေတသိက်တို့၏ မခံ့ညားမှုကို ငြိမ်းအေးစေခြင်း":"Calming the unwieldiness of the cetasikas","မခံ့ညားမှုကို ဖျက်ဆီးခြင်း":"Crushing unwieldiness","အာရုံပြုခြင်း၏ပြည့်စုံကြောင်းသဘော":"The nature of success in taking an object","စိတ်၏ မခံ့ညားမှုကို ငြိမ်းအေးစေခြင်း":"Calming the unwieldiness of the citta","စေတသိက်တို့၏ မနာဖျားခြင်းသဘော":"The nature of healthiness of the cetasikas","နာဖျားခြင်းကို ဖျက်ဆီးခြင်း":"Crushing sickness","အပြစ်အနာကင်းသော သဘော":"The nature of being free from fault and disease","စိတ်၏ မနာဖျားခြင်းသဘော":"The nature of healthiness of the citta","စေတသိက်တို့၏ ဖြောင့်မတ်ခြင်းသဘော":"The nature of straightness of the cetasikas","ကောက်ကျစ်မှုတို့ကို ဖျက်ဆီးခြင်း":"Crushing crookedness","မကောက်ကျစ်သည့်သဘော":"The nature of not being crooked","စိတ်၏ ဖြောင့်မတ်ခြင်းသဘော":"The nature of straightness of the citta","သဘာဝလက္ခဏာကို ထိုးထွင်းသိခြင်းသဘော":"The nature of penetrating the true characteristics","ဆီမီးကဲ့သို့ အာရုံကို ထွန်းပြခြင်း လင်းစေခြင်း":"Lighting up the object like a lamp, making it bright","မတွေဝေသော အခြင်းအရာ အားဖြင့် ဖြစ်ခြင်းသဘော":"The nature of non-confusion",သမာဓိ:"Samādhi","အာရုံကို အမှတ်ပြု၍ သိခြင်း":"Perceiving and recognising the object","ရှေးအမှတ်ဖြင့် နောက်ထပ်သိခြင်း":"Recognising again by means of the earlier mark","အမှတ်နိမိတ်အတိုင်း အာရုံကို နှလုံးသွင်းခြင်း":"Attending to the object according to the mark","ထင်လာတိုင်းသော အာရုံ":"The object just as it appears","ဣဋ္ဌာရုံကို ခံစားခြင်းသဘော":"The nature of experiencing a desirable object","အာရုံကို သုံးဆောင်ခံစားခြင်း":"Experiencing the object","သာယာဖွယ် သဘောတရား":"A pleasant nature","ပဿဒ္ဓိ":"Passaddhi","အလယ်အလတ် မဇ္ဈတ္တာရုံကို အလယ်အလတ် လျစ်လျူခံစားခြင်း":"The nature of experiencing a neutral object neutrally","မတိုးပွားစေလွန်း မညှိုးကြုံစေလွန်းခြင်း":"Neither increasing nor withering","ပီတိကင်းသောစိတ်":"A mind free of pīti","အနိဋ္ဌာရုံကို ခံစားခြင်းသဘော":"The nature of experiencing an undesirable object","စိတ်၌မှီသော နှိပ်စက်တတ်သော သဘောတရား":"A tormenting nature that depends on the mind",ဟဒယဝတ္ထု:"Hadayavatthu","အနိဋ္ဌဖောဋ္ဌဗ္ဗာရုံ၏ အရသာကို ခံစားခြင်းသဘော":"Experiencing the taste of an undesirable tangible object","သမ္ပယုတ်တရားတို့ကို ညှိုးနွမ်းစေခြင်း":"Withering the associated states","ကိုယ်၌ဖြစ်သော ဆင်းရဲသော သဘောတရား":"A painful nature arising in the body","ကာယိန္ဒြေ":"Kāyindriya","ဣဋ္ဌဖောဋ္ဌဗ္ဗာရုံ၏ အရသာကို ခံစားခြင်းသဘော":"Experiencing the taste of a desirable tangible object","သမ္ပယုတ်တရားတို့ကို လွန်စွာ တိုးပွားစေခြင်း":"Greatly increasing the associated states","ကိုယ်၌ဖြစ်သော သာယာအပ်သော သဘောတရား":"A pleasant nature arising in the body","ဝစီဒုစရိုက်၏ တည်ရာဝတ္ထုတို့ကို မလွန်ကျူးခြင်းသဘော":"The nature of not transgressing the grounds of verbal misconduct","ဝစီဒုစရိုက်၏ တည်ရာဝတ္ထုမှ တွန့်ဆုတ်ခြင်း":"Shrinking back from the grounds of verbal misconduct","ဝစီဒုစရိုက်ကို မပြုမကျင့် ရှောင်ကြဉ်သော သဘောတရား":"Abstaining from verbal misconduct","သဒ္ဓါ, ဟိရီ, ဩတ္တပ္ပ":"Saddhā, hirī, ottappa","ကာယဒုစရိုက်၏ တည်ရာဝတ္ထုတို့ကို မလွန်ကျူးခြင်းသဘော":"The nature of not transgressing the grounds of bodily misconduct","ကာယဒုစရိုက်မှ တွန့်ဆုတ်ခြင်း":"Shrinking back from bodily misconduct","ကာယဒုစရိုက်ကို မပြုကျင့်သောသဘောတရား":"Not practising bodily misconduct","မိစ္ဆာဇီဝကို မလွန်ကျူးခြင်းသဘော":"The nature of not transgressing wrong livelihood","မိစ္ဆာဇီဝမှ တွန့်ဆုတ်ခြင်း":"Shrinking back from wrong livelihood","မိစ္ဆာဇီဝကို မပြုကျင့်သော သဘောတရား":"Not practising wrong livelihood","သတ္တဝါတို့၏ ဆင်းရဲဒုက္ခကို ပယ်ရှားလိုသော အခြင်းအရာအားဖြင့် ဖြစ်ခြင်းသဘော":"The nature of wishing to remove the suffering of beings","သူတစ်ပါးတို့၏ ဆင်းရဲဒုက္ခကို သည်းမခံနိုင်ခြင်း":"Being unable to bear the suffering of others","သတ္တဝါတို့ကို မညှဉ်းဆဲခြင်းကို ရှေးရှု ဖြစ်စေတတ်၏":"Bringing about non-harming of beings","ဆင်းရဲဒုက္ခခံနေရသော သတ္တဝါတို့အပေါ် ယောနိသောမနသိကာရ":"Yoniso manasikāra toward beings who are suffering","သုခိတသတ္တဝါတို့၏ စည်းစိမ်ဥစ္စာ ကုံလုံပြည့်စုံသည်ကို ကြည်ရွှင်ဝမ်းမြောက်ခြင်းသဘော":"The nature of rejoicing in the success and prosperity of happy beings","သုခိတသတ္တဝါတို့၏ စည်းစိမ်ဥစ္စာ ကုံလုံပြည့်စုံသည်ကို မငြူစူခြင်း":"Not being envious of the prosperity of happy beings","မမွေ့လျော် မနှစ်သက်ခြင်းကို ပယ်ဖျောက်သော သဘောတရား":"Dispelling discontent and dislike","သုခိတသတ္တဝါတို့၏ စည်းစိမ်ဥစ္စာကို အသင့်ရှုနိုင်သော ယောနိသောမနသိကာရ":"Yoniso manasikāra that sees the prosperity of happy beings in the right way","အာရုံကို သိခြင်း = အာရုံကို ရယူခြင်းသဘော":"Knowing the object = taking the object","အာရုံကို သိမှု၌ ပဓာန ရှေ့သွားခေါင်းဆောင်ဖြစ်ခြင်း":"Being the forerunner and leader in knowing the object","စိတ်အစဉ်အဆက် မပြတ်ရအောင် ဖွဲ့စပ်တတ်သော သဘောတရား":"Joining the stream of consciousness so that it does not break","အတိတ်ဘဝ မရဏာသန္နဇောသည် ယူအပ်ခဲ့သော ကံ-ကမ္မနိမိတ်-ဂတိနိမိတ် တစ်မျိုးမျိုးကို ရယူခြင်းသဘော":"Taking one of the kamma / kamma-nimitta / gati-nimitta taken by the maraṇāsanna javana of the past life","ရှေ့ဘဝစိတ်အစဉ်နှင့် နောက်ဘဝစိတ်အစဉ်ကို ဆက်စပ်ပေးခြင်း":"Linking the stream of consciousness of the former life with that of the next life","ဘဝနှစ်ခုကို ဆက်စပ်ပေးတတ်သော သဘောတရား":"Linking the two lives","ယှဉ်ဖက် စေတသိက် နာမ် + မှီရာဝတ္ထုရုပ်":"The associated cetasikas (nāma) + the base rūpa","အတိတ်ဘဝ မရဏာသန္နဇောသည် ယူအပ်ခဲ့သော အာရုံ တစ်မျိုးမျိုးကို ရယူခြင်းသဘော":"Taking one of the objects taken by the maraṇāsanna javana of the past life","ရှေ့နောက် စိတ်အစဉ် မပြတ်ရအောင် ဘဝ၏အကြောင်းတရားအဖြစ် တည်နေခြင်း":"Staying as the condition of existence so that the stream of consciousness does not break, before and after","စိတ်အစဉ်ကို ဆက်စပ်ပေးတတ်သော သဘောတရား":"Linking the stream of consciousness","ရူပါရုံ စသည့် အာရုံတို့ကို သိခြင်းသဘော = ရယူခြင်းသဘော":"Knowing objects such as visible form = taking them","ရူပါရုံစသည့် ပဉ္စာရုံကို နှလုံးသွင်းခြင်း = ဆင်ခြင်ခြင်း":"Attending to the five sense objects such as visible form = adverting","အာရုံဘက်သို့ ရှေးရှူ မျက်နှာမူသည့် သဘောတရား":"Turning to face the object","ဘဝင်စိတ် ချုပ်ပျက်သွားခြင်း":"The passing away of the bhavaṅga citta","စက္ခုဝတ္ထုကို မှီဖြစ်၍ ရူပါရုံကို သိခြင်းသဘော":"Arising depending on the eye-base, knowing visible form","ရူပါရုံ အရောင်မျှကိုသာ သိခြင်း":"Knowing only the colour of visible form","ရူပါရုံဘက်သို့ ရှေးရှူမျက်နှာမူသည့် သဘောတရား":"Facing toward visible form","အာဝဇ္ဇန်းစိတ် ကင်းချုပ်ခြင်း":"The ceasing of the avajjana citta","သောတဝတ္ထုကို မှီဖြစ်၍ သဒ္ဒါရုံကို သိခြင်းသဘော":"Arising depending on the ear-base, knowing sound","သဒ္ဒါရုံ အသံမျှကိုသာ သိခြင်း":"Knowing only the sound","သဒ္ဒါရုံဘက်သို့ ရှေးရှူမျက်နှာမူသည့် သဘောတရား":"Facing toward sound","အာဝဇ္ဇန်းစိတ်၏ ကင်းချုပ်ခြင်း":"The ceasing of the avajjana citta","ဃာနဝတ္ထုကို မှီဖြစ်၍ ဂန္ဓာရုံကို သိခြင်းသဘော":"Arising depending on the nose-base, knowing smell","ဂန္ဓာရုံ = အနံ့မျှကိုသာ သိခြင်း":"Knowing only the smell","ဂန္ဓာရုံဘက်သို့ ရှေးရှူမျက်နှာမူသည့် သဘောတရား":"Facing toward smell","ဇိဝှါဝတ္ထုကို မှီဖြစ်၍ ရသာရုံကို သိခြင်းသဘော":"Arising depending on the tongue-base, knowing taste","ရသာရုံ = အရသာမျှကိုသာ သိခြင်း":"Knowing only the taste","ရသာရုံဘက်သို့ ရှေးရှူမျက်နှာမူသည့် သဘောတရား":"Facing toward taste","ကာယဝတ္ထုကို မှီဖြစ်၍ ဖောဋ္ဌဗ္ဗာရုံကို သိခြင်းသဘော":"Arising depending on the body-base, knowing the tangible","ဖောဋ္ဌဗ္ဗာရုံ = အတွေ့အထိမျှကိုသာ သိခြင်း":"Knowing only the touch","ဖောဋ္ဌဗ္ဗာရုံဘက်သို့ ရှေးရှူမျက်နှာမူသည့် သဘောတရား":"Facing toward the
