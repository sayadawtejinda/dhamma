<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ဖားအောက် ဓမ္မစာကြည့်တိုက်</title>
<meta name="theme-color" content="#7a1f1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ea;--bg2:#fdeccc;--card:#fff;--ink:#3a1e12;--mute:#8a6a52;--line:#ecd7b4;--accent:#b4381e;--accent2:#e8a21a;--accent-ink:#fff;--shadow:0 6px 22px rgba(122,52,18,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1410;--bg2:#2a1c14;--card:#2c211a;--ink:#f6e8d2;--mute:#c2a888;--line:#4a372a;--accent:#e2623f;--accent2:#f2b84a;--accent-ink:#1c1410;--shadow:0 6px 22px rgba(0,0,0,.45)}}
:root[data-theme=light]{--bg:#fff7ea;--bg2:#fdeccc;--card:#fff;--ink:#3a1e12;--mute:#8a6a52;--line:#ecd7b4;--accent:#b4381e;--accent2:#e8a21a;--accent-ink:#fff;--shadow:0 6px 22px rgba(122,52,18,.14)}
:root[data-theme=dark]{--bg:#1c1410;--bg2:#2a1c14;--card:#2c211a;--ink:#f6e8d2;--mute:#c2a888;--line:#4a372a;--accent:#e2623f;--accent2:#f2b84a;--accent-ink:#1c1410;--shadow:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Pyidaungsu","Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;padding-bottom:96px}
button{font:inherit;color:inherit;cursor:pointer}
header.hero{background:linear-gradient(135deg,#7a1f1f 0%,#b4381e 55%,#e8a21a 130%);color:#fff;padding:22px 16px 18px;position:relative;overflow:hidden}
header.hero::after{content:"☸";position:absolute;right:-18px;top:-30px;font-size:170px;opacity:.12}
.wrap{max-width:1100px;margin:0 auto}
header.hero h1{margin:0;font-size:1.55rem;line-height:1.35}
header.hero p{margin:4px 0 0;opacity:.9;font-size:.95rem}
#theme{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.2);border:0;border-radius:20px;padding:4px 10px;color:#fff;z-index:2}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px}
nav.tabs button{background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 18px;font-weight:600;color:var(--mute)}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent2)}
.search::before{content:"🔍";position:absolute;left:14px;top:11px}
select{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-size:.9rem}
.chip.on{background:var(--accent2);color:#2a1a08;border-color:var(--accent2);font-weight:600}
.count{color:var(--mute);font-size:.9rem;margin:4px 2px 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;width:100%}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.card h3{margin:0;font-size:1.02rem;line-height:1.45}
.card small{color:var(--mute)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.book{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .12s,box-shadow .12s}
.book:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.book .cv{aspect-ratio:3/4;background:linear-gradient(160deg,#7a1f1f,#e8a21a);display:grid;place-items:center;color:#fff;font-size:2rem;overflow:hidden}
.book .cv img{width:100%;height:100%;object-fit:cover;display:block}
.book h4{margin:0;padding:8px 10px 2px;font-size:.88rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book small{padding:0 10px 9px;color:var(--mute);font-size:.78rem}
dialog{border:0;border-radius:20px;padding:0;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.45);width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(30,10,0,.55)}
dialog.big{width:min(1000px,98vw);height:94vh}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;background:linear-gradient(135deg,#7a1f1f,#b4381e);color:#fff}
.dh h2{margin:0;font-size:1.15rem;flex:1;line-height:1.5}
.x{background:rgba(255,255,255,.2);border:0;border-radius:50%;width:34px;height:34px;color:#fff;font-size:1.1rem}
.db{padding:14px 18px;overflow:auto;max-height:calc(92vh - 150px)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--accent2);color:#2a1a08}
.trk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:6px}
.trk.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.trk .t{flex:1;min-width:0}
.trk .t b{display:block;font-size:.95rem}
.trk .t small{color:var(--mute)}
.trk button{border:0;background:var(--bg2);border-radius:50%;width:38px;height:38px}
.trk a{color:var(--mute);text-decoration:none;padding:4px 8px}
.pr{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.pr i{display:block;height:100%;background:var(--accent2);width:0}
#reader iframe{width:100%;height:calc(94vh - 130px);border:0;background:#fff}
.rt{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.rt input{width:90px;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
#player{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(0,0,0,.15);padding:8px 12px 10px;display:none}
#player.on{display:block}
#player .row{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
#pt{flex:1;min-width:0;font-size:.9rem;line-height:1.4}
#pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pt small{color:var(--mute)}
.pb{border:0;background:var(--bg2);border-radius:50%;width:40px;height:40px;font-size:1rem}
.pb.main{background:var(--accent);color:var(--accent-ink);width:48px;height:48px;font-size:1.2rem}
.pbar{max-width:1100px;margin:6px auto 0;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mute)}
.pbar input[type=range]{flex:1;accent-color:var(--accent)}
.pbar select{padding:3px 6px;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#2a1a10;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;max-width:90vw;font-size:.92rem}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.tile{border-radius:18px;padding:20px;color:#fff;cursor:pointer;border:0;text-align:left;min-height:120px;box-shadow:var(--shadow)}
.tile h3{margin:0 0 4px;font-size:1.2rem}.tile p{margin:0;opacity:.92;font-size:.92rem}
.t1{background:linear-gradient(135deg,#b4381e,#e8741a)}.t2{background:linear-gradient(135deg,#1f6f6a,#4aa08a)}.t3{background:linear-gradient(135deg,#5b3a8a,#9a6ad0)}
h2.sec{margin:22px 0 8px;font-size:1.1rem;color:var(--accent)}
.hint{background:var(--bg2);border-radius:12px;padding:10px 14px;color:var(--mute);font-size:.9rem;margin:10px 0}

/* ---- reader */
#texts .grp{margin:20px 0 8px;font-size:1.02rem;color:var(--accent);font-weight:700}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard h3{margin:0;font-size:1rem;line-height:1.5}.tcard small{color:var(--mute)}
.tcard .bar2{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.tcard .bar2 i{display:block;height:100%;background:var(--accent2)}
#rd{position:fixed;left:0;right:0;top:0;bottom:var(--pl,0px);z-index:40;display:none;flex-direction:column;--rbg:#fbf6ea;--rink:#2a2118;--rmute:#8a7358;--rline:#e6d6b6;--rac:#b4381e;--rpl:#6b3d8a;background:var(--rbg);color:var(--rink)}
#rd.on{display:flex}
#rd.t-sepia{--rbg:#efe0c0;--rink:#3a2a14;--rmute:#7d6643;--rline:#d8c295;--rac:#a1401a;--rpl:#5b3a73}
#rd.t-dark{--rbg:#15110e;--rink:#e9dcc6;--rmute:#a99578;--rline:#3a2e24;--rac:#f08a5d;--rpl:#c9a6e8}
.rbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rline);background:var(--rbg);flex-wrap:wrap}
.rbar h2{margin:0 4px;font-size:.98rem;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--rac)}
.rb{border:1px solid var(--rline);background:transparent;color:var(--rink);border-radius:10px;padding:5px 11px;font-size:.9rem}
.rb.on{background:var(--rac);color:var(--rbg);border-color:var(--rac)}
#rbody{flex:1;overflow-y:auto;padding:20px 16px 30px;scroll-behavior:smooth}
#rtext{max-width:740px;margin:0 auto;font-size:var(--fs,19px);line-height:2.05}
#rtext h2{font-size:1.45em;color:var(--rac);margin:1.2em 0 .5em;line-height:1.5;text-align:center}
#rtext h3{font-size:1.15em;margin:1.5em 0 .4em;padding-bottom:.2em;border-bottom:2px solid var(--rline);color:var(--rac);line-height:1.6}
#rtext h4{font-size:1.05em;margin:1.2em 0 .3em;color:var(--rmute);line-height:1.6}
#rtext p{margin:.55em 0}
#rtext .pali{color:var(--rpl);border-left:3px solid var(--rpl);padding-left:.8em;margin:.7em 0;font-size:.94em}
#rtext .verse{margin:1em 1.2em;padding:.4em 1em;border-left:4px solid var(--rac);background:rgba(180,56,30,.06);border-radius:0 10px 10px 0;line-height:2}
#rtext .quote{margin:.8em 1em;padding-left:.8em;border-left:3px solid var(--rline);color:var(--rmute)}
#rtext a.fn{font-size:.7em;vertical-align:super;color:var(--rac);cursor:pointer;text-decoration:none;font-weight:700;padding:0 1px}
#rtext a{color:var(--rac)}
#rtext mark{background:#ffd54a;color:#000;border-radius:3px}
#rd.nopali .pali{display:none}
#rd.nobr br.a{display:none}
.pgnav{display:flex;justify-content:center;align-items:center;gap:22px;margin:26px 0 10px}.pgnav .rb{padding:10px 26px;font-size:1.05rem}.pgnav span{color:var(--rmute)}.pgnav .rb:disabled{opacity:.3}
#rtext h5{font-size:1em;font-weight:700;color:var(--rac);margin:1.1em 0 .1em;line-height:1.7}
#rd{font-family:"Noto Sans Myanmar","Pyidaungsu","Myanmar Text",system-ui,sans-serif}
#rtext b{font-weight:700;color:var(--rbold,#7a1f1f);-webkit-text-stroke:.45px currentColor;paint-order:stroke fill}
#rd.t-sepia{--rbold:#6b2410}#rd.t-dark{--rbold:#ffd9a8}
.rnav{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--rline);background:var(--rbg)}
.rnav input[type=range]{flex:1;accent-color:var(--rac)}
.rnav small{color:var(--rmute);white-space:nowrap}
.rpanel{position:absolute;top:50px;bottom:52px;left:0;width:min(380px,92vw);background:var(--rbg);border-right:1px solid var(--rline);box-shadow:var(--shadow);z-index:3;display:none;flex-direction:column}
.rpanel.on{display:flex}
.rpanel input{margin:8px;padding:8px 12px;border-radius:10px;border:2px solid var(--rline);background:transparent;color:var(--rink);font:inherit}
.rpanel .lst{overflow-y:auto;flex:1;padding:0 6px 10px}
.rpanel button.it{display:block;width:100%;text-align:left;background:none;border:0;color:var(--rink);padding:6px 10px;border-radius:8px;font:inherit;font-size:.92rem;line-height:1.5;cursor:pointer}
.rpanel button.it:hover{background:var(--rline)}
.rpanel button.it small{color:var(--rmute);display:block}
#fnbox{position:absolute;left:10px;right:10px;bottom:58px;max-width:720px;margin:0 auto;background:var(--rbg);border:2px solid var(--rac);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);z-index:4;display:none;font-size:.95rem;line-height:1.7}
#fnbox.on{display:block}
.tapebtn{display:inline-block;margin-left:10px;font-size:.6em;vertical-align:middle;background:var(--rac);color:var(--rbg);border:0;border-radius:999px;padding:3px 12px;cursor:pointer}
.tr{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer;line-height:1.5}
.tr:hover{border-color:var(--accent2)}
.tr b{display:block;font-size:.98rem}.tr small{color:var(--mute)}
#tocres h3{margin:10px 0 6px;font-size:1rem;color:var(--accent)}
#btoc{display:none;max-height:34vh;overflow:auto;padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
#btoc button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 6px;border-radius:8px;font:inherit;font-size:.92rem;line-height:1.5;cursor:pointer;color:var(--ink)}
#btoc button:hover{background:var(--line)}
#btoc button.here{background:var(--accent2);color:#2a1a08;font-weight:700}
#btoc input{width:100%;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:4px}
@media(max-width:800px){.rt{gap:5px;padding:6px 8px}.rt .btn{padding:7px 12px}.rt input{width:64px}.dh{padding:10px 12px}#btoc{max-height:46vh}}</style>
</head>
<body>
<header class="hero"><button id="theme" title="Light / Dark">🌓</button><div class="wrap"><h1>☸ ဖားအောက်တောရ ဓမ္မစာကြည့်တိုက်</h1><p>တရားတော်များ နာယူရန် · တရားစာအုပ်များ ဖတ်ရှုရန်</p></div></header>
<nav class="tabs"><button data-t="home" class="on">ပင်မ</button><button data-t="sermons">🎧 တရားတော်</button><button data-t="books">📖 စာအုပ်</button><button data-t="texts">📚 ဖတ်စာ</button></nav>
<main class="wrap" style="padding:0 14px">
 <section id="home"></section>
 <section id="sermons" hidden>
  <div class="bar"><div class="search"><input id="sq" placeholder="တရားတော်ရှာရန် … (အမည်၊ နံပါတ်)" autocomplete="off"></div><select id="ss"><option value="no">စဉ်အလိုက်</option><option value="long">အရှည်ဆုံး</option><option value="az">အမည်အလိုက်</option></select></div>
  <div class="chips" id="schips"></div><div class="count" id="scount"></div><div class="list" id="slist"></div>
 </section>
 <section id="texts" hidden>
  <div class="bar"><div class="search"><input id="tq" placeholder="မာတိကာ / ခေါင်းစဉ် ရှာရန် … (ဖတ်စာအားလုံးထဲက)" autocomplete="off"></div></div>
  <div class="hint" style="margin-top:0">အွန်လိုင်းမှာ တိုက်ရိုက်ဖတ်ရန် စာအုပ်များ — စာမျက်နှာ မပါသည့်အတွက် အခန်း/ခေါင်းစဉ်အလိုက် စာမျက်နှာခွဲပေးထားပါသည်။</div>
  <div id="tres"></div><div id="tlist"></div>
 </section>
 <section id="books" hidden>
  <div class="bar"><div class="search"><input id="bq" placeholder="စာအုပ်အမည် / မာတိကာထဲက စာလုံး ရှာရန် …" autocomplete="off"></div></div>
  <div class="count" id="bcount"></div><div id="tocres"></div><div class="books" id="blist"></div>
 </section>
</main>

<dialog id="dsermon"><div class="dh"><h2 id="dst"></h2><button class="x" onclick="dsermon.close()">✕</button></div><div class="db" id="dsb"></div></dialog>
<dialog id="reader" class="big"><div class="dh"><h2 id="rtitle"></h2><button class="x" onclick="closeReader()">✕</button></div>
 <div class="rt"><span title="စာမျက်နှာ">📄</span><input id="rpage" type="number" min="1" value="1" title="စာမျက်နှာ"><button class="btn" id="rgo" title="သွားမည်">➜</button><button class="btn alt" id="rtc" title="မာတိကာ">☰</button><a class="btn alt" id="rdl" download title="ဒေါင်းလုပ်" style="text-decoration:none">⬇</a><a class="btn alt" id="rnew" target="_blank" rel="noopener" title="Tab အသစ်" style="text-decoration:none">↗</a><small id="rinfo" style="color:var(--mute)"></small></div>
 <div id="btoc"><input id="btq" placeholder="ဤစာအုပ်ရဲ့ မာတိကာထဲ ရှာရန် …"><div id="btl"></div></div>
 <iframe id="rframe" title="book"></iframe></dialog>

<div id="rd">
 <div class="rbar"><button class="rb" id="rtoc">☰ မာတိကာ</button><button class="rb" id="rsrch">🔍</button><h2 id="rtt"></h2>
  <button class="rb" id="rlis" hidden>🎧 တရားခွေ</button>
  <button class="rb" id="rpl">ပါဠိ</button><button class="rb" id="rbr" title="စာကြောင်းခွဲ">↵</button><button class="rb" id="rfm">A−</button><button class="rb" id="rfp">A+</button><button class="rb" id="rth">🎨</button><button class="rb" id="rcl">✕</button></div>
 <div class="rpanel" id="ptoc"><input id="ptq" placeholder="မာတိကာ ရှာရန် …"><div class="lst" id="ptl"></div></div>
 <div class="rpanel" id="psr"><input id="psq" placeholder="ဤစာအုပ်ထဲ ရှာရန် … (Enter)"><div class="lst" id="psl"></div></div>
 <div id="rbody"><div id="rtext"></div></div>
 <div id="fnbox"></div>
 <div class="rnav"><button class="rb" id="rpv">◀</button><input type="range" id="rsl" min="1" value="1"><small id="rpn"></small><button class="rb" id="rnx">▶</button></div>
</div>
<div id="player"><div class="pbar" style="margin:0 auto 4px"><span id="pcur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="pdur">0:00</span></div>
 <div class="row"><div id="pt"><b id="ptt">—</b><small id="pts"></small></div>
 <button class="pb" id="pprev" title="Previous">⏮</button><button class="pb" id="pb15" title="-15s">↺15</button><button class="pb main" id="pplay">▶</button><button class="pb" id="pf15" title="+15s">15↻</button><button class="pb" id="pnext" title="Next">⏭</button>
 <select id="spd" title="Speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
 <select id="slp" title="Sleep timer"><option value="0">😴 —</option><option value="15">15 မိနစ်</option><option value="30">30 မိနစ်</option><option value="60">60 မိနစ်</option></select></div></div>
<div id="toast"></div>

<script src="data/config.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DV='20261017b';   // bump when the data files change, so browsers do not show old copies
const CFG=Object.assign({audioBase:'audio/'},window.LIB_CONFIG||{});
const MD='၀၁၂၃၄၅၆၇၈၉',mn=n=>String(n).replace(/\d/g,d=>MD[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fmtLong=s=>{const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${mn(h)} နာရီ ${mn(m)} မိနစ်`:`${mn(m)} မိနစ်`};
function toast(t,ms=3500){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
// theme
(function(){const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t;$('#theme').onclick=()=>{const dark=matchMedia('(prefers-color-scheme:dark)').matches;const cur=document.documentElement.dataset.theme||(dark?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('theme',n)}})();
// tabs
function tab(t){$$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['home','sermons','books','texts'].forEach(x=>$('#'+x).hidden=x!==t);scrollTo(0,0);if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}
$$('nav.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

let S=[],B=[];
const norm=s=>String(s).toLowerCase().replace(/[​\s]+/g,' ');
const total=s=>s.tracks.reduce((a,t)=>a+t[2],0);
const url=t=>((CFG.audioBase2&&t[0]>1303)?CFG.audioBase2:(CFG.audioBase1||CFG.audioBase))+encodeURIComponent(t[1]);

// ---------- Sermons
const CATS=[['သုတ္တန်','သုတ္တန်'],['ဇာတ်','ဇာတ်'],['အပဒါန်','အပဒါန်'],['ကမ္မဋ္ဌာန်း','ကမ္မဋ္ဌာန်း'],['ဝိနည်း','ဝိနည်း'],['Retreat','Retreat'],['ပဋ္ဌာန်း','ပဋ္ဌာန်း']];
let cat='';
function renderChips(){const e=$('#schips');e.innerHTML='<button class="chip on" data-c="">အားလုံး</button>'+CATS.filter(c=>S.filter(s=>s.title.includes(c[0])).length>2).map(c=>`<button class="chip" data-c="${c[0]}">${c[1]}</button>`).join('');
 e.onclick=ev=>{const b=ev.target.closest('.chip');if(!b)return;cat=b.dataset.c;$$('#schips .chip').forEach(x=>x.classList.toggle('on',x===b));renderSermons()}}
function txt(s){return s._t||(s._t=norm((s.info||'')+' '+Object.values(s.topics||{}).join(' ')))}
function snippet(s,q){const t=(s.info||'')+' '+Object.entries(s.topics||{}).map(([k,v])=>`[ခွေ ${mn(k)}] ${v}`).join(' ');const i=norm(t).indexOf(q);if(i<0)return'';const a=Math.max(0,i-25);return '…'+esc(t.slice(a,i+q.length+45))+'…'}
function renderSermons(){
 const q=norm($('#sq').value.trim()),so=$('#ss').value;
 let l=S.filter(s=>(!cat||s.title.includes(cat))&&(!q||norm(s.title).includes(q)||norm(s.no).includes(q)||s.tracks.some(t=>norm(t[1]).includes(q))||txt(s).includes(q)));
 if(so==='long')l=[...l].sort((a,b)=>total(b)-total(a));if(so==='az')l=[...l].sort((a,b)=>a.title.localeCompare(b.title));
 $('#scount').textContent=`တရားတော် ${mn(l.length)} ပုဒ်`;
 $('#slist').innerHTML=l.length?l.map(s=>`<button class="card" data-id="${s.id}"><div class="num">${esc(s.no.replace('။','')||'＋')}</div><div><h3>${esc(s.title)}</h3><small>🎧 ${mn(s.tracks.length)} ခွေ · ${fmtLong(total(s))}</small>${q&&!norm(s.title).includes(q)&&txt(s).includes(q)?`<br><small style="color:var(--accent)">${snippet(s,q)}</small>`:''}</div></button>`).join(''):'<div class="empty">မတွေ့ပါ</div>';
}
$('#slist').onclick=e=>{const c=e.target.closest('.card');if(c)openSermon(+c.dataset.id)};
$('#sq').oninput=renderSermons;$('#ss').onchange=renderSermons;
let cache=null;const CN='lib-audio-v1';
async function getCache(){try{return cache||(cache=await caches.open(CN))}catch(e){return null}}
async function isSaved(t){const c=await getCache();return c?!!(await c.match(url(t))):false}
async function openSermon(id){
 const s=S.find(x=>x.id===id);if(!s)return;
 $('#dst').textContent=(s.no?s.no+' ':'')+s.title;
 const saved=await Promise.all(s.tracks.map(isSaved));
 const miss=s.expected-s.tracks.length;
 $('#dsb').innerHTML=(s.info?`<div class="hint" style="margin-top:0">${esc(s.info)}</div>`:'')+`<div class="acts"><button class="btn" id="pall">▶ အားလုံးဖွင့်မည်</button><button class="btn gold" id="sv">⬇ Offline သိမ်းမည်</button></div>
 <div class="pr" id="svp" hidden><i></i></div><small style="color:var(--mute)" id="svt">${mn(s.tracks.length)} ခွေ · ${fmtLong(total(s))}${miss>0?` · ⚠ ဖိုင် ${mn(miss)} ခု မတွေ့ပါ`:''}</small><div style="margin-top:10px">`+
 s.tracks.map((t,i)=>`<div class="trk" data-i="${i}"><button data-p="${i}">▶</button><div class="t"><b>ခွေ ${mn(i+1)} <small>(${esc(t[1])})</small></b><small>${fmt(t[2])} · ${(t[3]/1048576).toFixed(1)} MB ${saved[i]?'· ✅ offline':''}</small>${(s.topics&&s.topics[i+1])?`<div style="font-size:.86rem;margin-top:3px;line-height:1.5">${esc(s.topics[i+1])}</div>`:''}</div><a href="${url(t)}" download="${esc(t[1])}" title="Download">⬇</a></div>`).join('')+'</div>';
 $('#dsb').onclick=e=>{const p=e.target.closest('[data-p]');if(p)playQueue(s,+p.dataset.p)};
 $('#pall').onclick=()=>playQueue(s,0);
 $('#sv').onclick=()=>saveOffline(s);
 dsermon.showModal();markNow();
}
async function saveOffline(s){
 const c=await getCache();if(!c){toast('ဤ browser တွင် offline သိမ်း၍မရပါ');return}
 const bar=$('#svp'),i=bar.firstElementChild;bar.hidden=false;let done=0,fail=0;
 for(const t of s.tracks){try{if(!(await c.match(url(t)))){const r=await fetch(url(t));if(!r.ok)throw 0;await c.put(url(t),r)}}catch(e){fail++}done++;i.style.width=(done/s.tracks.length*100)+'%';$('#svt').textContent=`${mn(done)} / ${mn(s.tracks.length)}`}
 toast(fail?`သိမ်းပြီး (မအောင်မြင်သည် ${mn(fail)} ခု)`:'Offline သိမ်းပြီးပါပြီ ✅');openSermon(s.id);
}
// ---------- Player
const au=$('#au');let Q=null,QI=0,sleepT=null;
async function srcFor(t){const c=await getCache();if(c){const r=await c.match(url(t));if(r){return URL.createObjectURL(await r.blob())}}return url(t)}
async function playQueue(s,i){Q=s;QI=i;const t=s.tracks[i];
 const pos=store.get('pos:'+t[1],0);
 au.src=await srcFor(t);au.playbackRate=+$('#spd').value;
 au.onloadedmetadata=()=>{if(pos>5&&pos<au.duration-10)au.currentTime=pos;au.onloadedmetadata=null};
 try{await au.play()}catch(e){}
 $('#player').classList.add('on');document.documentElement.style.setProperty('--pl','96px');$('#ptt').textContent=`${s.no} ${s.title}`;$('#pts').textContent=`ခွေ ${mn(i+1)} / ${mn(s.tracks.length)}`;
 store.set('last',{id:s.id,i});markNow();
 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:'ဖားအောက်တောရ',album:`ခွေ ${i+1}/${s.tracks.length}`});
  navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));}
}
function step(d){if(!Q)return;const n=QI+d;if(n>=0&&n<Q.tracks.length)playQueue(Q,n)}
function markNow(){$$('#dsb .trk').forEach(e=>e.classList.toggle('now',Q&&$('#dst').textContent.includes(Q.title)&&+e.dataset.i===QI))}
au.onerror=()=>toast('အသံဖိုင်ကို မဖွင့်နိုင်ပါ — audio host သတ်မှတ်ချက် (data/config.js) သို့မဟုတ် အင်တာနက်ကို စစ်ပါ',6000);
au.onplay=()=>$('#pplay').textContent='⏸';au.onpause=()=>$('#pplay').textContent='▶';
au.onended=()=>{if(Q&&QI<Q.tracks.length-1)step(1)};
au.ontimeupdate=()=>{if(!au.duration)return;$('#pcur').textContent=fmt(au.currentTime);$('#pdur').textContent=fmt(au.duration);if(!seeking)$('#seek').value=au.currentTime/au.duration*1000;
 if(Q&&Math.floor(au.currentTime)%5===0)store.set('pos:'+Q.tracks[QI][1],au.currentTime)};
let seeking=false;$('#seek').oninput=()=>{seeking=true;if(au.duration)$('#pcur').textContent=fmt($('#seek').value/1000*au.duration)};
$('#seek').onchange=()=>{if(au.duration)au.currentTime=$('#seek').value/1000*au.duration;seeking=false};
$('#pplay').onclick=()=>au.paused?au.play():au.pause();
$('#pb15').onclick=()=>au.currentTime-=15;$('#pf15').onclick=()=>au.currentTime+=15;
$('#pprev').onclick=()=>step(-1);$('#pnext').onclick=()=>step(1);
$('#spd').onchange=()=>{au.playbackRate=+$('#spd').value;store.set('spd',$('#spd').value)};
$('#slp').onchange=()=>{clearTimeout(sleepT);const m=+$('#slp').value;if(m){sleepT=setTimeout(()=>{au.pause();$('#slp').value=0;toast('အိပ်ချိန်သတ်မှတ်ထားသဖြင့် ရပ်လိုက်ပါပြီ')},m*60000);toast(`${mn(m)} မိနစ်အကြာတွင် ရပ်ပါမည်`)}};
addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;if(e.code==='Space'&&Q){e.preventDefault();$('#pplay').click()}});
{const sp=store.get('spd',null);if(sp)$('#spd').value=sp}

// ---------- Books
function renderBooks(){const q=norm($('#bq').value.trim());const l=B.filter(b=>!q||norm(b.title).includes(q));
 $('#bcount').textContent=`စာအုပ် ${mn(l.length)} အုပ်`;
 $('#blist').innerHTML=l.map(b=>`<button class="book" data-id="${b.id}"><div class="cv"><img loading="lazy" src="covers/${b.cover||b.id+'.jpg'}" alt="" onerror="this.replaceWith('📖')"></div><h4>${esc(b.title)}</h4><small>${b.pages?mn(b.pages)+' စာမျက်နှာ · ':''}${b.mb} MB</small></button>`).join('')||'<div class="empty">မတွေ့ပါ</div>'}
$('#bq').oninput=()=>{renderBooks();renderToc($('#bq').value)};
$('#blist').onclick=e=>{const c=e.target.closest('.book');if(c)openBook(c.dataset.id)};
// The browser's own PDF viewer (Edge in particular) ignores page changes inside an iframe, so the book is shown in Mozilla's
// PDF.js viewer, which always opens the right page. The PDF is read from the published site (it needs CORS, which GitHub Pages allows).
const PDF_SITE='https://sayadawtejinda.github.io/dhamma/library/books/';
const pdfView=(id,pg)=>'https://mozilla.github.io/pdf.js/web/viewer.html?file='+encodeURIComponent(PDF_SITE+id+'.pdf')+'#page='+pg+'&zoom=page-width';
let curBook=null;
function openBook(id,pg){const b=B.find(x=>x.id===id);if(!b)return;curBook=b;
 pg=pg||store.get('bk:'+id,1);$('#rtitle').textContent=b.title;$('#rpage').value=pg;$('#rpage').max=b.pages||9999;
 $('#rdl').href=`books/${b.id}.pdf`;$('#rdl').download=b.title+'.pdf';$('#rnew').href=`books/${b.id}.pdf#page=${pg}`;$('#rinfo').textContent=b.pages?`/ ${mn(b.pages)}`:'';
 $('#rframe').src=pdfView(b.id,pg);reader.showModal();store.set('lastbook',id)}
function closeReader(){reader.close();$('#rframe').src='about:blank';$('#btoc').style.display='none'}
$('#rgo').onclick=()=>{const p=Math.max(1,+$('#rpage').value||1);store.set('bk:'+curBook.id,p);$('#rnew').href=`books/${curBook.id}.pdf#page=${p}`;$('#rframe').src=pdfView(curBook.id,p)};
$('#rpage').onkeydown=e=>{if(e.key==='Enter')$('#rgo').click()};

// ---------- Reader (online texts)
let TX=[],RB=null,RP=0,RC={};
const tmin=c=>Math.max(1,Math.round(c/900));
async function loadTexts(){TX=await (await fetch('texts/index.json?v='+DV)).json();renderTexts()}
function renderTexts(){const q=norm($('#tq').value.trim());let g=null,h='';
 TX.filter(b=>!q||norm(b.title).includes(q)||norm(b.group).includes(q)).forEach(b=>{
  if(b.group!==g){if(g!==null)h+='</div>';g=b.group;h+=`<div class="grp">${esc(g)}</div><div class="list">`}
  const pg=store.get('tx:'+b.id,0),pc=b.pages>1?Math.round(pg/(b.pages-1)*100):0;
  h+=`<button class="tcard" data-id="${b.id}"><h3>${esc(b.title)}</h3><small>≈ ${fmtLong(tmin(b.chars)*60)} ဖတ်ရန် · ${mn(b.pages)} စာမျက်နှာ${pg?` · ဖတ်ပြီး ${mn(pc)}%`:''}</small>${pg?`<div class="bar2"><i style="width:${pc}%"></i></div>`:''}</button>`});
 $('#tlist').innerHTML=h?h+'</div>':'<div class="empty">မတွေ့ပါ</div>'}
$('#tq').oninput=()=>{renderTexts();renderTres($('#tq').value)};
$('#tlist').onclick=e=>{const c=e.target.closest('.tcard');if(c)openText(c.dataset.id)};
const rd=$('#rd');
function setFS(d){const v=Math.min(34,Math.max(14,(store.get('fs',19))+d));store.set('fs',v);rd.style.setProperty('--fs',v+'px')}
function setTheme(t){rd.classList.remove('t-sepia','t-dark');if(t)rd.classList.add('t-'+t);store.set('rth',t)}
{rd.style.setProperty('--fs',store.get('fs',19)+'px');setTheme(store.get('rth',''));rd.classList.toggle('nopali',store.get('nopali',false));$('#rpl').classList.toggle('on',!store.get('nopali',false))}
rd.classList.toggle('nobr',!store.get('brk',true));$('#rbr').classList.toggle('on',store.get('brk',true));$('#rbr').onclick=()=>{const n=!store.get('brk',true);store.set('brk',n);$('#rbr').classList.toggle('on',n);rd.classList.toggle('nobr',!n)};
$('#rfp').onclick=()=>setFS(2);$('#rfm').onclick=()=>setFS(-2);
$('#rth').onclick=()=>{const c=['','sepia','dark'];setTheme(c[(c.indexOf(store.get('rth',''))+1)%3])};
$('#rpl').onclick=()=>{const n=!store.get('nopali',false);store.set('nopali',n);rd.classList.toggle('nopali',n);$('#rpl').classList.toggle('on',!n)};
$('#rcl').onclick=()=>{rd.classList.remove('on');document.body.style.overflow='';renderTexts();history.replaceState(null,'','#texts')};
$('#rtoc').onclick=()=>{$('#psr').classList.remove('on');$('#ptoc').classList.toggle('on')};
$('#rsrch').onclick=()=>{$('#ptoc').classList.remove('on');$('#psr').classList.toggle('on');if($('#psr').classList.contains('on'))$('#psq').focus()};
async function openText(id,toIdx){
 const b=TX.find(x=>x.id===id);if(!b)return;
 RB=await (await fetch(`texts/${id}.json?v=${DV}`)).json();RC={};$('#fnbox').classList.remove('on');
 $('#rtt').textContent=RB.title;rd.classList.add('on');document.body.style.overflow='hidden';
 $('#rsl').max=RB.pages.length;
 $('#ptl').innerHTML=RB.toc.map(t=>`<button class="it" data-i="${t[0]}" style="padding-left:${10+(t[1]-2)*14}px">${esc(t[2])}</button>`).join('')||'<div class="empty">—</div>';
 const sm=RB.sermonId&&S.find(s=>s.id===RB.sermonId);
 $('#rlis').hidden=!sm;$('#rlis').onclick=()=>{if(sm)openSermon(sm.id)};
 $('#psl').innerHTML='';$('#psq').value='';$('#ptoc').classList.remove('on');$('#psr').classList.remove('on');
 await showPage(toIdx!=null?pageOf(toIdx):Math.min(store.get('tx:'+id,0),RB.pages.length-1),toIdx);
}
const pageOf=i=>{let lo=0,hi=RB.pages.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(RB.pages[m]<=i)lo=m;else hi=m-1}return lo};
async function chunk(k){if(!RC[k])RC[k]=await (await fetch(`texts/${RB.id}.${k}.json?v=${DV}`)).json();return RC[k]}
function inl(h){return h.replace(/\u0001(\d+)\u0002/g,(m,n)=>`<a class="fn" data-n="${n}">[${mn(n)}]</a>`)}
async function showPage(p,scrollTo){
 RP=Math.max(0,Math.min(RB.pages.length-1,p));const st=RB.pages[RP],en=RP+1<RB.pages.length?RB.pages[RP+1]:RB.n;
 const ks=[];for(let k=Math.floor(st/RB.chunk);k<=Math.floor((en-1)/RB.chunk);k++)ks.push(k);
 await Promise.all(ks.map(chunk));
 let h='';
 for(let i=st;i<en;i++){const [k,x]=RC[Math.floor(i/RB.chunk)][i%RB.chunk];const t=inl(x);
  if(k==='h2'||k==='h3'||k==='h4'){let extra='';
   if(RB.tapeChapters&&k==='h2'){const m=x.match(/^ခွေ ([၀-၉]+)/);if(m){extra=`<button class="tapebtn" data-tape="${[...m[1]].map(c=>'၀၁၂၃၄၅၆၇၈၉'.indexOf(c)).join('')}">▶ ခွေ ${m[1]} နာမည်</button>`}}
   h+=`<${k} id="b${i}">${t}${extra}</${k}>`}
  else if(k==='sh')h+=`<h5 id="b${i}">${t}</h5>`;
  else if(k==='pl')h+=`<p class="pali" id="b${i}">${t}</p>`;
  else if(k==='v')h+=`<div class="verse" id="b${i}">${t}</div>`;
  else if(k==='q')h+=`<div class="quote" id="b${i}">${t}</div>`;
  else h+=`<p id="b${i}">${t}</p>`}
 $('#rtext').innerHTML=h+`<div class="pgnav"><button class="rb" onclick="showPage(RP-1)" ${RP?'':'disabled'}>◀</button><span>${mn(RP+1)} / ${mn(RB.pages.length)}</span><button class="rb" onclick="showPage(RP+1)" ${RP+1<RB.pages.length?'':'disabled'}>▶</button></div>`;
 $('#rsl').value=RP+1;$('#rpn').textContent=`${mn(RP+1)} / ${mn(RB.pages.length)}`;
 store.set('tx:'+RB.id,RP);
 const sc=$('#rbody');sc.style.scrollBehavior='auto';
 if(scrollTo!=null){const el=document.getElementById('b'+scrollTo);if(el){el.scrollIntoView({block:'center'});if(RB.hl)hilite(el,RB.hl)}}else sc.scrollTop=0;
 sc.style.scrollBehavior='';
}
function hilite(el,q){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(q);if(i<0)return;const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+q.length);const m=document.createElement('mark');r.surroundContents(m)})}
// swipe left / right on the text = next / previous page (vertical scrolling is left alone)
{let sx=0,sy=0,st=0;const el=$('#rbody');
 el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
 el.addEventListener('touchend',e=>{if(!RB||!st)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;const dt=Date.now()-st;st=0;
  if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)&&dt<700&&!getSelection().toString()){showPage(RP+(dx<0?1:-1))}},{passive:true})}
$('#rpv').onclick=()=>showPage(RP-1);$('#rnx').onclick=()=>showPage(RP+1);
$('#rsl').onchange=()=>showPage(+$('#rsl').value-1);
$('#rsl').oninput=()=>$('#rpn').textContent=`${mn($('#rsl').value)} / ${mn(RB.pages.length)}`;
$('#ptl').onclick=e=>{const b=e.target.closest('.it');if(!b)return;RB.hl=null;$('#ptoc').classList.remove('on');showPage(pageOf(+b.dataset.i),+b.dataset.i)};
$('#ptq').oninput=()=>{const q=norm($('#ptq').value);$$('#ptl .it').forEach(b=>b.style.display=norm(b.textContent).includes(q)?'':'none')};
$('#rtext').onclick=e=>{
 const f=e.target.closest('a.fn');
 if(f){const n=f.dataset.n,box=$('#fnbox');box.innerHTML=`<b>[${mn(n)}]</b> `+inl(RB.fn[n]||'—');box.classList.add('on');return}
 const t=e.target.closest('[data-tape]');if(t){const sm=S.find(s=>s.id===RB.sermonId&&s.tracks.length>=+t.dataset.tape);if(sm)playQueue(sm,+t.dataset.tape-1);else toast('ဤခွေအတွက် အသံဖိုင် မတွေ့ပါ')}};
document.addEventListener('click',e=>{if(!e.target.closest('a.fn')&&!e.target.closest('#fnbox'))$('#fnbox').classList.remove('on')});
async function searchBook(){
 const q=norm($('#psq').value.trim());if(!q||!RB)return;const out=$('#psl');out.innerHTML='<div class="empty">ရှာနေသည်…</div>';
 const nk=Math.ceil(RB.n/RB.chunk);await Promise.all([...Array(nk).keys()].map(chunk));
 const res=[];
 for(let i=0;i<RB.n&&res.length<200;i++){const x=RC[Math.floor(i/RB.chunk)][i%RB.chunk][1].replace(/<[^>]+>|\u0001\d+\u0002/g,'');const j=x.toLowerCase().indexOf(q);if(j>=0)res.push([i,x.slice(Math.max(0,j-30),j+q.length+50),j])}
 out.innerHTML=res.length?res.map(r=>`<button class="it" data-i="${r[0]}">…${esc(r[1])}…<small>စာမျက်နှာ ${mn(pageOf(r[0])+1)}</small></button>`).join('')+(res.length>=200?'<div class="empty">ပထမ ၂၀၀ ခုသာ</div>':''):'<div class="empty">မတွေ့ပါ</div>';
 out.onclick=ev=>{const b=ev.target.closest('.it');if(!b)return;RB.hl=q;$('#psr').classList.remove('on');showPage(pageOf(+b.dataset.i),+b.dataset.i)}}
$('#psq').onkeydown=e=>{if(e.key==='Enter')searchBook()};
addEventListener('keydown',e=>{if(!rd.classList.contains('on')||/input/i.test(e.target.tagName))return;if(e.key==='ArrowRight')showPage(RP+1);if(e.key==='ArrowLeft')showPage(RP-1);if(e.key==='Escape')$('#rcl').click()});



// contents search across all reading texts
let TT=null;
async function loadTT(){if(!TT){try{TT=await (await fetch('texts/toc.json?v='+DV)).json();TT.norm=TT.toc.map(e=>nt(e[3]))}catch(e){TT={books:[],toc:[],norm:[]}}}return TT}
async function renderTres(q){
 const box=$('#tres');q=nt(q);if(q.length<2){box.innerHTML='';return}
 const T=await loadTT();const res=[];
 for(let i=0;i<T.toc.length&&res.length<500;i++){const k=T.norm[i].indexOf(q);if(k>=0)res.push([k,i])}
 res.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 if(!res.length){box.innerHTML='<h3 style="margin:10px 0;color:var(--accent);font-size:1rem">မာတိကာထဲမှာ မတွေ့ပါ</h3>';return}
 box.innerHTML=`<h3 style="margin:10px 0 6px;color:var(--accent);font-size:1rem">📑 မာတိကာထဲက ရလဒ် ${mn(res.length)}${res.length>=500?'+':''} ခု</h3>`+res.slice(0,150).map(([k,i])=>{const e=T.toc[i],b=TX.find(x=>x.id===T.books[e[0]]);return b?`<button class="tr" data-b="${b.id}" data-i="${e[1]}"><b>${esc(e[3])}</b><small>📚 ${esc(b.title)}</small></button>`:''}).join('');
}
$('#tres').onclick=e=>{const t=e.target.closest('.tr');if(t)openText(t.dataset.b,+t.dataset.i)};

// ---------- Contents (မာတိကာ) of the PDF books: searchable, opens the PDF at the page
let TOC=null;
async function loadToc(){if(!TOC){try{TOC=await (await fetch('data/toc.json?v='+DV)).json();TOC.norm=TOC.toc.map(e=>nt(e[1]))}catch(e){TOC={books:[],toc:[],norm:[]}}}return TOC}
const nt=s=>String(s).toLowerCase().replace(/[A-Za-z\s\u200b၊။.,()\[\]\-_:;'"]+/g,'');
async function renderToc(q){
 const box=$('#tocres');q=nt(q);
 if(q.length<2){box.innerHTML='';return}
 const T=await loadToc();const res=[];
 for(let i=0;i<T.toc.length&&res.length<400;i++){const k=T.norm[i].indexOf(q);if(k>=0)res.push([k,i])}
 res.sort((a,b)=>a[0]-b[0]);
 if(!res.length){box.innerHTML='<h3>မာတိကာထဲမှာ မတွေ့ပါ</h3>';return}
 box.innerHTML=`<h3>📑 မာတိကာထဲက ရလဒ် ${mn(res.length)}${res.length>=400?'+':''} ခု</h3>`+res.slice(0,150).map(([k,i])=>{const e=T.toc[i],b=B.find(x=>x.id===T.books[e[0]]);return b?`<button class="tr" data-b="${b.id}" data-p="${e[6]||e[2]}"><b>${esc(e[1])}</b><small>📖 ${esc(b.title)} · စာမျက်နှာ ${mn(e[6]||e[2])}</small></button>`:''}).join('');
}
$('#tocres').onclick=e=>{const t=e.target.closest('.tr');if(t)openBook(t.dataset.b,+t.dataset.p)};
$('#rtc').onclick=async()=>{const box=$('#btoc');if(box.style.display==='block'){box.style.display='none';return}
 const T=await loadToc();const bi=T.books.indexOf(curBook.id);
 const rows=bi<0?[]:T.toc.filter(e=>e[0]===bi);
 $('#btl').innerHTML=rows.length?rows.map(e=>`<button data-p="${e[6]||e[2]}" style="padding-left:${6+(e[3]-1)*14}px">${esc(e[1])} <small style="color:var(--mute)">· ${mn(e[6]||e[2])}</small></button>`).join(''):'<div class="empty" style="padding:10px">ဤစာအုပ်အတွက် မာတိကာ မရှိပါ</div>';
 $('#btq').value='';box.style.display='block';
 const cp=+$('#rpage').value||1;let best=null;$$('#btl button').forEach(b=>{b.classList.remove('here');if(+b.dataset.p<=cp)best=b});
 if(best){best.classList.add('here');best.scrollIntoView({block:'center'})}};
$('#btl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=+b.dataset.p;$('#rpage').value=p;$('#btoc').style.display='none';$('#rgo').click()};
$('#btq').oninput=()=>{const q=nt($('#btq').value);$$('#btl button').forEach(b=>b.style.display=!q||nt(b.textContent).includes(q)?'':'none')};

// ---------- Home
function renderHome(){const last=store.get('last',null),lb=store.get('lastbook',null);
 const ls=last&&S.find(s=>s.id===last.id),bk=lb&&B.find(b=>b.id===lb);
 $('#home').innerHTML=`<div class="home"><button class="tile t1" data-go="sermons"><h3>🎧 တရားတော်များ</h3><p>${mn(S.length)} စုံ · ${mn(S.reduce((a,s)=>a+s.tracks.length,0))} ခွေ · ${fmtLong(S.reduce((a,s)=>a+total(s),0))}</p></button>
 <button class="tile t2" data-go="books"><h3>📖 တရားစာအုပ်များ</h3><p>${mn(B.length)} အုပ် — PDF ဖွင့်ဖတ်ရန်</p></button><button class="tile t3" data-go="texts"><h3>📚 အွန်လိုင်းဖတ်စာ</h3><p>စာသားအတိုင်း ဖတ်ရန် · ရှာရန် · မာတိကာ</p></button></div>`
 +(ls?`<h2 class="sec">ဆက်နာမည်</h2><button class="card" data-s="${ls.id}" data-i="${last.i}"><div class="num">▶</div><div><h3>${esc(ls.title)}</h3><small>ခွေ ${mn(last.i+1)} မှ ဆက်နာရန်</small></div></button>`:'')
 +(bk?`<h2 class="sec">နောက်ဆုံးဖတ်သည့်စာအုပ်</h2><button class="card" data-b="${bk.id}"><div class="num">📖</div><div><h3>${esc(bk.title)}</h3><small>စာမျက်နှာ ${mn(store.get('bk:'+bk.id,1))} မှ ဆက်ဖတ်ရန်</small></div></button>`:'')
 +`<h2 class="sec">အကြံပြုချက်</h2><div class="hint">စာအုပ်ကို ဖွင့်ပြီး စာမျက်နှာနံပါတ်ရိုက်ကာ တိုက်ရိုက်သွားနိုင်ပါသည်။ တရားတော်ကို <b>Offline သိမ်းမည်</b> နှိပ်ပြီး အင်တာနက်မရှိလည်း နာနိုင်ပါသည်။ Space ခုံနှိပ်၍ ရပ်/ဖွင့်နိုင်ပါသည်။</div>`;
 $('#home').onclick=e=>{const g=e.target.closest('[data-go]');if(g)return tab(g.dataset.go);const s=e.target.closest('[data-s]');if(s){tab('sermons');return playQueue(S.find(x=>x.id==s.dataset.s),+s.dataset.i)}const b=e.target.closest('[data-b]');if(b)openBook(b.dataset.b)}}

Promise.all([fetch('data/sermons.json?v='+DV).then(r=>r.json()),fetch('data/books.json?v='+DV).then(r=>r.json())]).then(([s,b])=>{S=s;B=b;renderChips();renderSermons();renderBooks();renderHome();loadTexts();const h=location.hash.slice(1);if(['sermons','books','texts'].includes(h))tab(h)})
 .catch(()=>{$('#home').innerHTML='<div class="empty">ဒေတာဖိုင်များ မဖွင့်နိုင်ပါ</div>'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){/* offline audio uses Cache Storage directly; no service worker needed */}
