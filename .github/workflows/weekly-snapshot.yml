name: Weekly snapshot

# Refreshes the static files the apps read instead of Firestore (see scripts/generate-weekly-snapshot.mjs).
# The work is spread over four days so Firebase is never read all at once (09:00 UTC = early morning in California):
#   Monday    classes  -- SmartStudy / Abhidhamma / Dhammaschool boards + trophy announcements (the Sunday class is in)
#   Tuesday   core     -- attendance, trophies, weeks attended, each student's history (Monday classes are in)
#   Wednesday content  -- Myanmar Speaker content + every student's Avatar look
#   Thursday  roster   -- the "active this week" lists, Shrine Room and Nature World pictures
# Run it by hand from the Actions tab: pick a part, or leave it empty to refresh everything.
on:
  schedule:
    - cron: "0 9 * * 1,2,3,4"
  workflow_dispatch:
    inputs:
      part:
        description: "classes, core, content or roster (empty = everything)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Regenerate snapshot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(date -u +%u)" in
              1) P=classes;;
              2) P=core;;
              3) P=content;;
              4) P=roster;;
            esac
          else
            P="${{ github.event.inputs.part }}"
          fi
          ARG=""
          if [ -n "$P" ]; then ARG="--only=$P"; fi
          echo "Part: ${P:-everything}"
          node scripts/generate-weekly-snapshot.mjs $ARG

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/weeklySnapshot.json public/classSnapshots public/contentSnapshots public/announcementsSnapshot.json public/avatarSnapshot.json public/scheduleSnapshot.json public/studentWeekly.json public/studentWeeklyKeys.json public/weeklyState.json public/rosterSnapshots public/studentHistory public/weekFiles public/todaySchedule.json
          if git diff --cached --quiet; then
            echo "No change -- nothing to commit."
          else
            git commit -m "Weekly snapshot refresh"
            git pull --rebase origin main
            git push
            gh workflow run deploy.yml || echo "Could not start the publish step by itself; it will happen with the next push."
          fi
