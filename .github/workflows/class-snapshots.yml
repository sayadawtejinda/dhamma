name: Class snapshots

# Refreshes only the class leaderboards students read as static files (SmartStudy scores and
# reflections, Abhidhamma) -- see scripts/class-snapshots.mjs. Only what is new since the last run is
# read, so when nobody has studied nothing is read, nothing changes and nothing is committed.
#
# The weekly job (weekly-snapshot.yml) does this too; this one exists to refresh the boards on demand
# (Actions tab -> Run workflow), and once more shortly before a SmartStudy contest ends so its
# Global Leaderboard shows the final scores. The scheduled line below is that "before the prizes" run
# for the TADINGYUT contest: 10:00 AM Pacific on 14 October.
on:
  schedule:
    - cron: "0 17 14 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: class-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh class snapshots
        run: npm run snapshot:classes

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/classSnapshots public/contentSnapshots public/announcementsSnapshot.json public/avatarSnapshot.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Class snapshots refresh"
            git pull --rebase origin main
            git push
          fi
