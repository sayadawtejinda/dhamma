name: Close open Watch & Learn sessions

# A student who closes the app (or the phone) while watching never reports, and nothing on
# their device can close the session afterwards. Every hour this closes any Watch &
# Learn session that has run past the end of the student's class + 15 minutes (or 45 minutes
# in all), so its coins stop counting there (see scripts/close-open-sessions.mjs), and pays the
# prizes of a SmartStudy contest that has ended (scripts/pay-contest-prizes.mjs). It runs once an
# hour (it used to run every 15 minutes) to keep the Firebase reads low: each run reads only a
# few documents, and when there is no contest running that part reads one empty query.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: close-open-sessions
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Close open sessions
        run: node scripts/close-open-sessions.mjs

      - name: Pay SmartStudy contest prizes that are due
        run: node scripts/pay-contest-prizes.mjs

      # A class the teacher just created (or whose lessons were edited) gets its static file built here, within the hour,
      # so students never have to read the big class document from Firebase. Reads ONE tiny document when nothing is new.
      - name: Check for a new or edited class
        id: classcheck
        run: node scripts/check-new-class.mjs

      - name: Rebuild the class files
        if: steps.classcheck.outputs.needed == 'true'
        run: npm run snapshot:classes

      # a contest ends within 3 hours: show the final standings (only what is new is read)
      - name: Refresh the leaderboards before a contest ends
        if: steps.classcheck.outputs.needed != 'true' && steps.classcheck.outputs.boards == 'true'
        run: npm run snapshot:boards

      - name: Commit, push and publish if changed
        if: steps.classcheck.outputs.needed == 'true' || steps.classcheck.outputs.boards == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/classSnapshots public/contentSnapshots public/announcementsSnapshot.json public/avatarSnapshot.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Class files rebuilt (new or edited class)"
            git pull --rebase origin main
            git push
            gh workflow run deploy.yml || echo "Could not start the publish step by itself; it will happen with the next push."
          fi
