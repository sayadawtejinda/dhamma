name: Close open Watch & Learn sessions

# A student who closes the app (or the phone) while watching never reports, and nothing on
# their device can close the session afterwards. Every 15 minutes this closes any Watch &
# Learn session that has run past the end of the student's class + 15 minutes (or 45 minutes
# in all), so its coins stop counting there. See scripts/close-open-sessions.mjs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close-open-sessions
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Close open sessions
        run: node scripts/close-open-sessions.mjs

      - name: Pay SmartStudy contest prizes that are due
        run: node scripts/pay-contest-prizes.mjs

      # The Parami report: when the teacher pressed "Confirm" in the app, rebuild its files and put them on GitHub
      # (the students' page reads them as plain files). With nothing to publish this reads one small document.
      - name: Rebuild the Parami report if the teacher confirmed a change
        id: parami
        run: node scripts/publish-parami-report.mjs

      - name: Put the Parami report on GitHub
        if: steps.parami.outputs.requestedAt != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/paramiReport.json public/paramiReportFull.json
          if git diff --cached --quiet; then
            echo "Parami report: files unchanged."
          else
            git commit -m "Parami report published"
            git pull --rebase origin main
            git push
          fi
          node scripts/mark-parami-published.mjs "${{ steps.parami.outputs.requestedAt }}"
